<script>
/* ===== basis ===== */
const SB_URL='https://koenqjuwnngluqxseodq.supabase.co',SB_KEY='sb_publishable_FV0_pSspnXUlZXFES5Ga4w_gzlX2kFm';
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const ls={get:(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const rid=()=>Math.random().toString(36).slice(2,10);
let actx;const beep=(f=660,d=.08)=>{try{if(localStorage.getItem('kp_mute')==='1')return;actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;g.gain.setValueAtTime(.15,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}};
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate([80,60,80])}catch(e){}};
let wl=null;const wake=async()=>{try{if('wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>wl=null)}}catch(e){}};document.addEventListener('click',wake);
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))),unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const genKeys=async()=>{const k=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveKey']);return{pub:b64(await crypto.subtle.exportKey('raw',k.publicKey)),priv:await crypto.subtle.exportKey('jwk',k.privateKey)}};
const derive=async(privJwk,pubB64)=>{const priv=await crypto.subtle.importKey('jwk',privJwk,{name:'ECDH',namedCurve:'P-256'},false,['deriveKey']);const pub=await crypto.subtle.importKey('raw',unb64(pubB64),{name:'ECDH',namedCurve:'P-256'},false,[]);return crypto.subtle.deriveKey({name:'ECDH',public:pub},priv,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])};
const enc=async(key,obj)=>{const iv=crypto.getRandomValues(new Uint8Array(12));const d=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj)));return{iv:b64(iv),d:b64(d)}};
const dec=async(key,m)=>JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(m.iv)},key,unb64(m.d))));

/* ===== woorden ===== */
const WORDS={
 'Plaatsen':['Strand','Ziekenhuis','Bioscoop','Supermarkt','Kerk','Luchthaven','Zwembad','Gevangenis','Bibliotheek','Dierentuin','Festivalweide','Fitness','Kapper','Treinstation','Ruimtestation','Duikboot','Kasteel','Casino','Skipiste','Camping','Studentenkot','Aula','Frituur','Cocktailbar','Politiekantoor','Pretpark','Bowlingbaan','Sauna','Voetbalstadion','Tandarts'],
 'Eten en drinken':['Pizza','Sushi','Frieten','Wafel','Spaghetti','Kebab','Hamburger','Croque monsieur','Stoofvlees','Mosselen','Pannenkoek','Chocolademousse','Tiramisu','Lasagne','Taco','Popcorn','Jenever','Mojito','Gin-tonic','Cava','Duvel','Koffie','Smoothie','IJsje','Donut','Croissant','Curryworst','Bitterballen','Nachos','Fondue'],
 'Beroepen':['Dokter','Leraar','Piloot','Kok','Brandweerman','Politieagent','Advocaat','Kapper','Bakker','Tandarts','DJ','Influencer','Boer','Loodgieter','Astronaut','Journalist','Verpleger','Postbode','Architect','Dierenarts','Barman','Clown','Schilder','Rechter','Buschauffeur','Ober','Goochelaar','Bouwvakker','Fotograaf','Programmeur'],
 'Dieren':['Olifant','Giraf','Pinguïn','Kangoeroe','Leeuw','Haai','Dolfijn','Koala','Panda','Krokodil','Uil','Papegaai','Slang','Schildpad','Egel','Vos','Wolf','Paard','Koe','Varken','Kip','Hamster','Octopus','Kameel','Zebra','Aap','Beer','Konijn','Muis','Vleermuis'],
 'Dingen in huis':['Koelkast','Wasmachine','Tandenborstel','Spiegel','Bank','Matras','Microgolf','Stofzuiger','Afstandsbediening','Lamp','Kussen','Strijkijzer','Föhn','Wekker','Paraplu','Gordijn','Douche','Brievenbus','Kaars','Waterkoker','Broodrooster','Sleutelbos','Vaatwas','Badjas','Pantoffels','Laptop','Kapstok','Plant','Vuilbak','Ladder'],
 'Landen en steden':['Parijs','Londen','New York','Rome','Barcelona','Amsterdam','Tokio','Dubai','Ibiza','Berlijn','Praag','Lissabon','Gent','Brugge','Antwerpen','Oostende','Marrakech','Las Vegas','Los Angeles','Rio de Janeiro','Sydney','Bangkok','IJsland','Zwitserland','Griekenland','Mexico','Egypte','Japan','Canada','Noorwegen'],
 'Films en series':['Harry Potter','Titanic','Shrek','Frozen','The Lion King','Star Wars','Jurassic Park','Toy Story','James Bond','Squid Game','Stranger Things','Friends','La Casa de Papel','Game of Thrones','Breaking Bad','The Office','Thuis','FC De Kampioenen','Spider-Man','Batman','Avatar','Barbie','Top Gun','Pirates of the Caribbean','The Avengers','Finding Nemo','Mr. Bean','Home Alone','Grease','Rocky'],
 'Merken':['Nike','Adidas','Apple','Samsung','Coca-Cola','McDonalds','IKEA','Lego','Netflix','Spotify','Tesla','BMW','Ferrari','Red Bull','Jupiler','Duvel','Nutella','Google','TikTok','Instagram','Zara','Primark','Delhaize','Colruyt','Lidl','Rolex','Gucci','PlayStation','Nintendo','Uber'],
 'Op kot en studeren':['Blok','Examen','Cantus','Doop','Overpoort','Aula','Lesrooster','Kotbaas','Afwas','Huisgenoot','Ontbijt om 14u','Pizza om middernacht','Wasmand','Studentenresto','Bibliotheek','Prof','Powerpoint','Groepswerk','Deadline','Herexamen','Studentenclub','Fuif','Kater','Kotfeest','Fietsenstalling','Koffieautomaat','Vakantiejob','Erasmus','Thesis','Proclamatie'],
 'Sport en vrije tijd':['Voetbal','Tennis','Skiën','Zwemmen','Bowling','Karaoke','Darts','Paintball','Escape room','Klimmen','Surfen','Wielrennen','Yoga','Boksen','Golf','Basketbal','Hockey','Beerpong','Poker','Minigolf','Kajakken','Schaken','Paardrijden','Joggen','Volleybal','Padel','Snowboarden','Kamperen','Vissen','Dansen']};
const CATS=Object.keys(WORDS);

/* ===== realtime ===== */
const sb=window.supabase?window.supabase.createClient(SB_URL,SB_KEY,{realtime:{params:{eventsPerSecond:20}}}):null;
let ch=null,IS_HOST=false;
const join=(code,pid,meta,onMsg)=>new Promise(res=>{ch=sb.channel('sp-'+code,{config:{broadcast:{self:false},presence:{key:pid}}});
  ch.on('broadcast',{event:'m'},({payload})=>onMsg(payload));ch.subscribe(async s=>{if(s==='SUBSCRIBED'){await ch.track(meta);res()}})});
const send=p=>{ch&&ch.send({type:'broadcast',event:'m',payload:p});if(IS_HOST&&(p.t==='state'||(p.t==='priv'&&p.to===Pl.pid)))setTimeout(()=>onPlayerMsg(p),0)};
const toHost=p=>IS_HOST?onHostMsg(p):send(p);

/* ===== spelleider (toestel van wie de lobby maakt) ===== */
const H={code:null,keys:null,players:{},order:[],keyCache:{},phase:'lobby',opt:{spies:0,hint:true,cat:'mix'},spies:[],word:null,cat:null,starter:null,votes:{},ready:{},result:null,caught:null,guess:null,round:0,score:{}};
const saveH=()=>{const c={...H};delete c.keyCache;c.t=Date.now();ls.set('sp_host',c)};
const pkey=async pid=>H.keyCache[pid]||(H.keyCache[pid]=await derive(H.keys.priv,H.players[pid].pub));
const nm=p=>H.players[p]?.n||'?';
const nSpies=n=>H.opt.spies||(n>=9?2:1);
const pub=()=>({t:'state',phase:H.phase,code:H.code,hostPub:H.keys.pub,round:H.round,
  players:H.order.map(p=>({id:p,n:nm(p),ready:!!H.ready[p],voted:!!H.votes[p]})),starter:H.starter?nm(H.starter):null,
  order:H.phase!=='lobby'?H.talkOrder.map(nm):[],nSpies:H.phase==='lobby'?nSpies(H.order.length):H.spies.length,opt:H.opt,
  result:H.result,word:H.phase==='end'?H.word:null,cat:H.cat,spies:H.phase==='end'?H.spies.map(nm):null,caught:H.caught?nm(H.caught):null,guess:H.guess,
  tally:H.phase==='end'?tally():null,score:H.order.map(p=>({n:nm(p),s:H.score[p]||0})),host:Pl.pid});
const tally=()=>{const c={};Object.values(H.votes).forEach(v=>c[v]=(c[v]||0)+1);return Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({n:nm(k),v}))};
const broadcast=()=>{send(pub());saveH()};
const priv=async pid=>{const p=H.players[pid];if(!p||!p.pub)return;const k=await pkey(pid);const spy=H.spies.includes(pid);
  const o={phase:H.phase,spy,word:spy?null:H.word,cat:spy&&!H.opt.hint?null:H.cat,mates:spy?H.spies.filter(x=>x!==pid).map(nm):null,ready:!!H.ready[pid],voted:H.votes[pid]?nm(H.votes[pid]):null};
  if(H.phase==='vote')o.choices=H.order.filter(x=>x!==pid).map(x=>({id:x,n:nm(x)}));
  if(H.phase==='guess'&&H.caught===pid)o.guessOpts=H.guessOpts;
  send({t:'priv',to:pid,...await enc(k,o)})};
const privAll=()=>H.order.forEach(priv);
const start=()=>{const n=H.order.length;if(n<3)return;H.round++;const cat=H.opt.cat==='mix'?CATS[Math.random()*CATS.length|0]:H.opt.cat;H.cat=cat;
  H.word=WORDS[cat][Math.random()*WORDS[cat].length|0];H.spies=shuf(H.order).slice(0,Math.min(nSpies(n),Math.floor((n-1)/2)||1));
  H.starter=H.order[Math.random()*n|0];const i=H.order.indexOf(H.starter);H.talkOrder=H.order.slice(i).concat(H.order.slice(0,i));
  H.votes={};H.ready={};H.result=null;H.caught=null;H.guess=null;H.guessOpts=null;H.phase='reveal';broadcast();privAll()};
const goVote=()=>{H.phase='vote';H.votes={};broadcast();privAll()};
const resolveVote=()=>{if(H.phase!=='vote')return;const c={};Object.values(H.votes).forEach(v=>c[v]=(c[v]||0)+1);const t=Object.entries(c).sort((a,b)=>b[1]-a[1]);
  if(!t.length||(t[1]&&t[1][1]===t[0][1])){finish('spies','tie');return}
  const top=t[0][0];
  if(H.spies.includes(top)){H.caught=top;H.guessOpts=shuf([H.word].concat(shuf(WORDS[H.cat].filter(w=>w!==H.word)).slice(0,7)));H.phase='guess';broadcast();privAll()}
  else{H.caught=top;finish('spies','wrong')}};
const finish=(w,why)=>{H.result={w,why};H.phase='end';const win=w==='spies'?H.spies:H.order.filter(x=>!H.spies.includes(x));win.forEach(x=>H.score[x]=(H.score[x]||0)+(w==='spies'?3:1));broadcast();privAll()};
const hostAct=(pid,a)=>{const p=H.players[pid];if(!p)return;
  if(a.kind==='ready'&&H.phase==='reveal'){H.ready[pid]=true;broadcast();priv(pid);return}
  if(a.kind==='vote'&&H.phase==='vote'&&H.players[a.target]&&a.target!==pid){H.votes[pid]=a.target;beep(700);broadcast();priv(pid);if(Object.keys(H.votes).length>=H.order.length)setTimeout(resolveVote,800);return}
  if(a.kind==='guess'&&H.phase==='guess'&&pid===H.caught){H.guess=a.w;finish(a.w===H.word?'spies':'village',a.w===H.word?'guessed':'caught');return}
  if(pid===Pl.pid&&a.kind==='cmd'){({talk:()=>{H.phase='talk';broadcast();privAll()},vote:goVote,close:resolveVote,again:start,lobby:()=>{H.phase='lobby';broadcast();privAll()}}[a.c]||(()=>{}))()}};
const onHostMsg=async m=>{
  if(m.t==='join'){const ex=H.players[m.pid];
    if(!ex){if(H.phase!=='lobby'){send({t:'reject',to:m.pid,why:'Er loopt al een ronde. Wacht tot ze gedaan is en probeer opnieuw.'});return}
      let nn=m.n.slice(0,16),k=2;while(Object.entries(H.players).some(([id,p])=>id!==m.pid&&p.n.toLowerCase()===nn.toLowerCase()))nn=m.n.slice(0,14)+' '+(k++);
      H.players[m.pid]={n:nn,pub:m.pub};H.order.push(m.pid);beep(880)}
    else if(ex.pub!==m.pub){ex.pub=m.pub;delete H.keyCache[m.pid]}
    broadcast();priv(m.pid);return}
  if(m.t==='act'&&H.players[m.pid]){let a;try{a=await dec(await pkey(m.pid),m)}catch(e){return}hostAct(m.pid,a)}
  if(m.t==='hello'){send(pub());priv(m.pid)}};
const makeCode=()=>Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0]).join('');
const startHost=async resume=>{IS_HOST=true;const s=ls.get('sp_host',null),me=ls.get('sp_hostme',null);
  if(resume&&s&&me&&s.players&&s.players[me.pid]&&Date.now()-s.t<6*3.6e6){Object.assign(H,s);H.keyCache={};Object.assign(Pl,me);return startHost2()}
  H.code=makeCode();H.keys=await genKeys();Pl.pid=rid();Pl.keys=await genKeys();
  app.innerHTML=`<div style="font-size:80px">🕵️</div><div class="h1">Nieuwe lobby</div><div class="hint">Jij maakt de lobby en speelt gewoon mee.</div><input class="f" id="nm" maxlength="16" placeholder="Je naam" autocomplete="off" value="${esc(ls.get('ww_name',''))}"><button class="btn" id="ok">Maak lobby</button>`;
  const go=()=>{const v=$('#nm').value.trim();if(!v)return;Pl.n=v.slice(0,16);ls.set('ww_name',Pl.n);startHost2()};$('#ok').onclick=go;$('#nm').onkeydown=e=>{if(e.key==='Enter')go()}};
const startHost2=async()=>{wake();Pl.code=H.code;ls.set('sp_hostme',{pid:Pl.pid,keys:Pl.keys,n:Pl.n});$('#me').textContent=Pl.n;
  if(!H.players[Pl.pid]){H.players[Pl.pid]={n:Pl.n,pub:Pl.keys.pub};H.order.unshift(Pl.pid)}
  app.innerHTML=`<div class="h2">Lobby maken…</div>`;await join(H.code,Pl.pid,{n:Pl.n},onHostMsg);broadcast();privAll()};

/* ===== speler ===== */
const Pl={pid:null,n:'',keys:null,key:null,code:null,state:null,mine:null,sel:null,show:false};
const startPlayer=async code=>{Pl.code=code.toUpperCase();const st=ls.get('sp_p_'+Pl.code,null);
  Pl.pid=st?.pid||rid();Pl.keys=st?.keys||await genKeys();Pl.n=st?.n||ls.get('ww_name','');
  if(!Pl.n){app.innerHTML=`<div class="mono">Lobby ${esc(Pl.code)}</div><div class="h1">Hoe heet je?</div><input class="f" id="nm" maxlength="16" placeholder="Je naam" autocomplete="off"><button class="btn" id="ok">Doe mee</button>`;
    const go=()=>{const v=$('#nm').value.trim();if(!v)return;ls.set('ww_name',v);startPlayer(Pl.code)};$('#ok').onclick=go;$('#nm').onkeydown=e=>{if(e.key==='Enter')go()};return}
  ls.set('sp_p_'+Pl.code,{pid:Pl.pid,keys:Pl.keys,n:Pl.n});$('#me').textContent=Pl.n;app.innerHTML=`<div class="h2">Verbinden…</div>`;
  await join(Pl.code,Pl.pid,{n:Pl.n},onPlayerMsg);toHost({t:'join',pid:Pl.pid,n:Pl.n,pub:Pl.keys.pub});
  setTimeout(()=>{if(!Pl.state)app.innerHTML=`<div class="h2">Lobby ${esc(Pl.code)} niet gevonden</div><div class="hint">Klopt de code? Is de lobby nog open bij wie hem maakte?</div><button class="btn" onclick="location.href=location.pathname">Andere code</button>`},6000)};
const onPlayerMsg=async m=>{
  if(m.t==='state'){const first=!Pl.state;Pl.state=m;if(!Pl.key||Pl.hostPub!==m.hostPub){Pl.hostPub=m.hostPub;Pl.key=await derive(Pl.keys.priv,m.hostPub)}if(first&&!IS_HOST)toHost({t:'join',pid:Pl.pid,n:Pl.n,pub:Pl.keys.pub});render();return}
  if(m.t==='priv'&&m.to===Pl.pid&&Pl.key){try{const prev=Pl.mine;Pl.mine=await dec(Pl.key,m);if(!prev||prev.phase!==Pl.mine.phase){Pl.sel=null;Pl.show=false;buzz()}render()}catch(e){}return}
  if(m.t==='reject'&&m.to===Pl.pid){app.innerHTML=`<div class="h2">${esc(m.why)}</div><button class="btn" onclick="location.href=location.pathname">Terug</button>`}};
const act=async o=>{const e=await enc(Pl.key,o);toHost({t:'act',pid:Pl.pid,...e});beep(880)};
const hb=(btns)=>IS_HOST&&btns.length?`<div class="row">${btns.map(([c,l,g])=>`<button class="${g?'tbtn':'btn'}" data-hc="${c}">${l}</button>`).join('')}</div><div class="small">Jij maakte de lobby, dus jij bedient de knoppen.</div>`:'';
const bindHb=()=>app.querySelectorAll('[data-hc]').forEach(b=>b.onclick=()=>act({kind:'cmd',c:b.dataset.hc}));
const card=me=>me.spy?`<div class="role" style="--c:#ffffff"><div class="emo">🕵️</div><div class="mono">Jij bent</div><div class="rn">De imposter</div>${me.cat?`<div class="small">Categorie: <b style="color:#ededed">${esc(me.cat)}</b></div>`:''}${me.mates&&me.mates.length?`<div class="small">${me.mates.length>1?'Andere imposters':'Andere imposter'}: <b style="color:#ffffff">${me.mates.map(esc).join(', ')}</b></div>`:''}<div class="hint" style="color:#cfcfcf">Je kent het woord niet. Luister goed, doe alsof en raad het woord.</div></div>`
  :`<div class="role" style="--c:#d4ff3a"><div class="emo">🔑</div><div class="mono">Het geheime woord</div><div class="rn">${esc(me.word||'')}</div><div class="small">Categorie: ${esc(me.cat||'')}</div><div class="hint" style="color:#cfcfcf">Geef hints zonder het woord te verklappen: de imposter luistert mee.</div></div>`;
const render=()=>{const s=Pl.state,me=Pl.mine||{};if(!s)return;
  if(s.phase==='lobby'){
    if(IS_HOST){const n=H.order.length,url=location.origin+location.pathname+'?c='+H.code;
      const seg=(k,o,cur)=>`<div class="seg">${o.map(([v,l])=>`<button class="${String(cur)===String(v)?'on':''}" data-o="${k}" data-v="${v}">${l}</button>`).join('')}</div>`;
      app.innerHTML=`<div class="mono">Laat de anderen scannen of de code invullen</div><div class="code-big">${H.code}</div><div id="qr"></div>
        <div class="plist">${H.order.map(p=>`<span class="pchip">${esc(nm(p))}${p===Pl.pid?' (jij)':`<span class="x" data-kick="${p}">✕</span>`}</span>`).join('')}</div>
        <details class="opts" ${Pl.oo?'open':''}><summary class="peek" style="list-style:none">⚙️ Instellingen</summary><div class="optgrid">
          <span class="mono">Imposters</span>${seg('spies',[[0,'Auto'],[1,'1'],[2,'2'],[3,'3']],H.opt.spies)}
          <span class="mono">Hint imposter</span>${seg('hint',[[1,'Categorie'],[0,'Niets']],H.opt.hint?1:0)}
          <span class="mono">Categorie</span><div class="plist" style="justify-content:flex-start">${['mix'].concat(CATS).map(c=>`<button class="pchip ${H.opt.cat===c?'on2':''}" data-cat="${c}">${c==='mix'?'Alles door elkaar':c}</button>`).join('')}</div></div></details>
        <div class="hint">${n>=3?`${nSpies(n)} ${nSpies(n)>1?'imposters':'imposter'} met ${n} spelers.`:'Minstens 3 spelers nodig.'}</div>
        <div class="small" style="color:#d4ff3a">⚠️ Het spel draait op jouw toestel: laat deze pagina open tot het gedaan is.</div>
        <button class="btn" id="go" ${n<3?'disabled':''}>Start (${n} spelers)</button>`;
      try{new QRCode($('#qr'),{text:url,width:200,height:200,correctLevel:QRCode.CorrectLevel.M})}catch(e){}
      const d=app.querySelector('details');d.ontoggle=()=>{Pl.oo=d.open};
      app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{H.opt[b.dataset.o]=b.dataset.o==='hint'?b.dataset.v==='1':+b.dataset.v;broadcast()});
      app.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{H.opt.cat=b.dataset.cat;broadcast()});
      app.querySelectorAll('[data-kick]').forEach(b=>b.onclick=()=>{const id=b.dataset.kick;delete H.players[id];H.order=H.order.filter(x=>x!==id);send({t:'reject',to:id,why:'Je werd uit de lobby verwijderd.'});broadcast()});
      $('#go').onclick=start;return}
    app.innerHTML=`<div class="mono">Lobby ${esc(s.code)}</div><div class="h1">Je zit erin</div><div class="hint">Wacht tot het spel start.</div><div class="plist">${s.players.map(p=>`<span class="pchip">${esc(p.n)}${p.id===Pl.pid?' (jij)':''}</span>`).join('')}</div>`;return}
  const peek=`<button class="peek" id="pk">${Pl.show?'Verberg':'Toon'} ${me.spy?'mijn rol':'het woord'}</button><div class="${Pl.show?'':'hide'}" style="width:100%;display:flex;justify-content:center">${card(me)}</div>`;
  const bindPeek=()=>{const b=$('#pk');if(b)b.onclick=()=>{Pl.show=!Pl.show;render()}};
  if(s.phase==='reveal'){const nr=s.players.filter(p=>p.ready).length;
    app.innerHTML=`${card(me)}<div class="small">Hou je scherm verborgen voor de anderen.</div>${me.ready?`<div class="h2">Klaar</div><div class="small">${nr}/${s.players.length} klaar</div>`:'<button class="btn" id="rd">Gezien, ik ben klaar</button>'}${hb([['talk',`Begin (${nr}/${s.players.length} klaar)`]])}`;
    const r=$('#rd');if(r)r.onclick=()=>act({kind:'ready'});bindHb();return}
  if(s.phase==='talk'){app.innerHTML=`${peek}<div class="mono">Ronde ${s.round}</div><div class="h2">Om beurten één woord</div><div class="hint">Zeg elk één woord dat bij het geheime woord past. Doe twee rondes, daarna stemmen jullie.</div>
      <div class="plist">${s.order.map((n,i)=>`<span class="pchip">${i+1}. ${esc(n)}</span>`).join('')}</div>${hb([['vote','Nu stemmen']])}`;bindPeek();bindHb();return}
  if(s.phase==='vote'){const nv=s.players.filter(p=>p.voted).length;
    if(me.voted){app.innerHTML=`<div style="font-size:70px">🗳️</div><div class="h2">Je stemde op ${esc(me.voted)}</div><div class="small">${nv}/${s.players.length} stemmen</div>${hb([['close','Sluit stemming']])}`;bindHb();return}
    app.innerHTML=`<div class="mono">Stemming</div><div class="h2">Wie is de imposter?</div><div class="grid">${(me.choices||[]).map(c=>`<button class="choice ${Pl.sel===c.id?'sel':''}" data-c="${c.id}">${esc(c.n)}</button>`).join('')}</div><button class="btn" id="cf" ${Pl.sel?'':'disabled'}>Bevestig</button>${hb([['close',`Sluit stemming (${nv}/${s.players.length})`,1]])}`;
    app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{Pl.sel=b.dataset.c;render()});$('#cf').onclick=()=>{if(Pl.sel)act({kind:'vote',target:Pl.sel})};bindHb();return}
  if(s.phase==='guess'){if(me.guessOpts){app.innerHTML=`<div style="font-size:70px">🕵️</div><div class="h2">Je bent betrapt!</div><div class="hint">Laatste kans: raad het geheime woord. Juist? Dan win je toch.</div><div class="grid">${me.guessOpts.map(w=>`<button class="choice" data-w="${esc(w)}">${esc(w)}</button>`).join('')}</div>`;
      app.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>act({kind:'guess',w:b.dataset.w}));return}
    app.innerHTML=`<div style="font-size:70px">🕵️</div><div class="h2">${esc(s.caught)} is betrapt</div><div class="hint">${esc(s.caught)} was inderdaad een imposter en krijgt nog één kans om het woord te raden…</div>`;return}
  if(s.phase==='end'){const r=s.result||{},sw=r.w==='spies',iSpy=me.spy,won=sw===!!iSpy;
    const why={tie:'Gelijkstand bij de stemming: de imposter ontsnapt.',wrong:`Jullie stemden op ${esc(s.caught||'')}, maar dat was geen imposter.`,guessed:`${esc(s.caught||'')} werd betrapt, maar raadde het woord: ${esc(s.guess||'')}.`,caught:`${esc(s.caught||'')} werd betrapt en raadde fout (${esc(s.guess||'')}).`}[r.why]||'';
    app.innerHTML=`<div style="font-size:80px">${sw?'🕵️':'🏡'}</div><div class="h1">${sw?(s.spies.length>1?'De imposters winnen':'De imposter wint'):'Imposter betrapt'}</div><div class="hint">${why}</div>
      <div class="task" style="border-color:#d4ff3a"><span class="mono">Het woord was</span><b style="color:#d4ff3a">${esc(s.word||'')}</b></div><div class="small">${s.spies.length>1?'Imposters':'Imposter'}: <b style="color:#ffffff">${s.spies.map(esc).join(', ')}</b></div>
      <div class="h2" style="color:${won?'var(--acc)':'var(--wolf)'}">${won?'Gewonnen!':'Verloren: drink 2 slokken'}</div>
      ${s.tally&&s.tally.length?`<div class="small">Stemmen: ${s.tally.map(t=>esc(t.n)+' '+t.v).join(' · ')}</div>`:''}
      <div class="small">Stand: ${s.score.slice().sort((a,b)=>b.s-a.s).map(x=>esc(x.n)+' '+x.s).join(' · ')}</div>${hb([['again','Nog een ronde'],['lobby','Terug naar lobby',1]])}`;bindHb();return}};

/* ===== start ===== */
const landing=()=>{app.innerHTML=`<div style="font-size:80px">🕵️</div><div class="h1">Imposter</div><div class="hint">Vul de code in van wie de lobby maakte.</div>
  <input class="f code" id="cd" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters"><button class="btn" id="jn">Naar de lobby</button><button class="tbtn" id="hs">Zelf een lobby maken</button>
  <div class="rlist" style="margin-top:20px"><div class="rc" style="--c:#d4ff3a"><b>Zo werkt het</b><span>Iedereen krijgt hetzelfde geheime woord op zijn gsm, behalve de imposter. Om beurten zeg je één woord dat erbij past. Daarna stemmen jullie wie de imposter is. Betrapt? Dan mag de imposter nog het woord raden. Wie verliest, drinkt 2 slokken.</span></div></div>`;
  const go=()=>{const c=$('#cd').value.trim().toUpperCase();if(c.length===4)location.href=location.pathname+'?c='+c};$('#jn').onclick=go;$('#cd').onkeydown=e=>{if(e.key==='Enter')go()};
  $('#hs').onclick=()=>location.href=location.pathname+'?host=1'};
(async()=>{if(!sb){app.innerHTML='<div class="h2 err">Geen internet: Imposter heeft een verbinding nodig.</div>';return}
  const q=new URLSearchParams(location.search);
  if(q.get('host')){const s=ls.get('sp_host',null);if(s&&s.phase!=='lobby'&&Date.now()-s.t<6*3.6e6&&!q.get('new')){app.innerHTML=`<div class="h2">Er loopt nog een spel (code ${esc(s.code)})</div><div class="row"><button class="btn" id="rs">Verder spelen</button><button class="tbtn" id="nw">Nieuw spel</button></div>`;
      $('#rs').onclick=()=>startHost(true);$('#nw').onclick=()=>startHost(false);return}
    return startHost(!!(s&&Date.now()-s.t<3.6e6))}
  if(q.get('c'))return startPlayer(q.get('c'));landing()})();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){wl=null;wake();if(Pl.pid&&ch&&!IS_HOST)send({t:'hello',pid:Pl.pid})}});
</script>
</body>
</html>
