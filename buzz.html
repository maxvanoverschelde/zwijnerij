  ls.set('bq_p_'+Pl.code,{pid:Pl.pid,n:Pl.n});$('#me').textContent=Pl.n;app.innerHTML=`<div class="h2">Verbinden…</div>`;
  await join(Pl.code,Pl.pid,{n:Pl.n},onPlayerMsg);send({t:'join',pid:Pl.pid,n:Pl.n});
  setTimeout(()=>{if(!Pl.state)app.innerHTML=`<div class="h2">Quiz ${esc(Pl.code)} niet gevonden</div><div class="hint">Klopt de code? Staat de quiz nog open op de iPad?</div><button class="btn" onclick="location.href=location.pathname">Andere code</button>`},6000)};
const onPlayerMsg=m=>{
  if(m.t==='state'){const first=!Pl.state,prev=Pl.state;Pl.state=m;if(first)send({t:'join',pid:Pl.pid,n:Pl.n});
    if(m.buzz===Pl.pid&&(!prev||prev.buzz!==Pl.pid))vib([200,80,200]);renderPlayer();return}
  if(m.t==='reject'&&m.to===Pl.pid){app.innerHTML=`<div class="h2">Je werd uit de quiz verwijderd.</div>`}};
const renderPlayer=()=>{const s=Pl.state;if(!s)return;const me=s.players.find(p=>p.id===Pl.pid);
  if(s.phase==='lobby'){app.innerHTML=`<div class="mono">Quiz ${esc(s.code)}</div><div class="h1">Je zit erin</div><div class="hint">Wacht tot de quiz start op de iPad.</div>`;return}
  if(s.phase==='end'){const r=s.players.slice().sort((a,b)=>b.s-a.s);app.innerHTML=`<div class="h1">Gedaan</div><div class="h2">${me?me.s:0} juist</div><div class="hint">Plaats ${r.findIndex(p=>p.id===Pl.pid)+1} van ${r.length}. Kijk naar de iPad.</div>`;return}
  const locked=s.locked.includes(Pl.pid),mine=s.buzz===Pl.pid,open=s.phase==='q'&&!s.buzz&&!locked;
  const rk=s.players.slice().sort((a,b)=>b.s-a.s),pos=me?1+rk.filter(p=>p.s>me.s).length:0,lead=rk[0];
  app.innerHTML=`<div class="mono">Vraag ${s.n} / ${s.max} · ${me?me.s:0} ${me&&me.s===1?'punt':'punten'}${pos&&rk.length>1&&rk[0].s>0?' · plaats '+pos+'/'+rk.length:''}</div>${lead&&lead.s>0&&lead.id!==Pl.pid?`<div class="small" style="color:var(--muted)">👑 ${esc(lead.n)} leidt met ${lead.s}</div>`:lead&&lead.s>0?'<div class="small" style="color:var(--acc)">👑 Jij leidt!</div>':''}
    <button class="bigbuzz ${open?'':'off'} ${mine?'mine':''}" id="bz" ${open?'':'disabled'}>${s.phase==='shown'?(mine?'JUIST!':locked?'FOUT':s.buzz?'✓':'—'):mine?'JIJ!':s.buzz?esc(s.buzzN):locked?'GEBLOKT':s.phase==='q'?'BUZZ':'…'}</button>
    <div class="hint">${s.phase==='shown'?(mine?'Juist! +1 punt voor jou.':s.buzz?esc(s.buzzN)+' had het juist.':locked?'Fout. Niemand had het juist.':'Niemand had het. Kijk naar de iPad.'):mine?'Jij was eerst: geef je antwoord hardop.':s.buzz?esc(s.buzzN)+' mag antwoorden.':locked?'Fout geantwoord: je wacht deze vraag over.':s.phase==='q'?'Lees de vraag op de iPad en druk als je het weet.':'Wacht op de volgende vraag.'}</div>`;
  if(s.phase==='shown'&&mine&&Pl.lastOk!==s.n){Pl.lastOk=s.n;vib([60,60,120])}
  const b=$('#bz');if(open)b.onpointerdown=e=>{e.preventDefault();send({t:'buzz',pid:Pl.pid});b.classList.add('off');vib(60)}};

/* ===== start ===== */
const landing=()=>{app.innerHTML=`<div style="font-size:80px">🎵</div><div class="h1">Raad het liedje</div><div class="hint">Vul de code in die op de iPad staat.</div>
  <input class="f code" id="cd" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters"><button class="btn" id="jn">Meedoen</button><button class="tbtn" id="hs">Quiz starten op dit toestel</button>`;
  const go=()=>{const c=$('#cd').value.trim().toUpperCase();if(c.length===4)location.href=location.pathname+'?c='+c};$('#jn').onclick=go;$('#cd').onkeydown=e=>{if(e.key==='Enter')go()};
  $('#hs').onclick=()=>location.href=location.pathname+'?host=1'};
(async()=>{if(!sb){app.innerHTML='<div class="h2 err">Geen internet: Raad het liedje heeft een verbinding nodig.</div>';return}
  const q=new URLSearchParams(location.search);
  if(q.get('host')){const s=ls.get('bq_host',null);return startHost(!!(s&&s.phase!=='lobby'&&s.phase!=='end'&&Date.now()-s.t<3.6e6&&!q.get('new')))}
  if(q.get('c'))return startPlayer(q.get('c'));landing()})();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){wl=null;wake();if(Pl.pid&&ch)send({t:'hello',pid:Pl.pid})}});
</script>
</body>
</html>
