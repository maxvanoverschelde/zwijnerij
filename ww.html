<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{--bg:#070707;--fg:#ededed;--muted:#7a7a7a;--line:#222;--card:#101010;--acc:#d4ff3a;--wolf:#ff4d6d;--moon:#7aa2ff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);color:var(--fg);font-family:'Inter Tight',system-ui,sans-serif}
body{padding:calc(env(safe-area-inset-top,0px) + 20px) max(20px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom,0px) + 24px) max(20px,env(safe-area-inset-left));min-height:100vh;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none}
body.night{background:radial-gradient(circle at 50% -10%,#16203d 0%,#070707 60%)}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.mono{font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.brand{font-family:'Anton',sans-serif;font-size:26px;text-transform:uppercase;letter-spacing:.01em}
.brand i{font-style:normal;color:var(--wolf)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;width:100%;max-width:1100px;margin:0 auto}
.h1{font-family:'Anton',sans-serif;font-size:clamp(40px,8vw,96px);line-height:.95;text-transform:uppercase}
.h2{font-family:'Anton',sans-serif;font-size:clamp(28px,5vw,54px);line-height:1;text-transform:uppercase}
.hint{color:var(--muted);font-size:17px;line-height:1.45;max-width:640px}
.btn{background:var(--acc);color:#000;font-family:'JetBrains Mono',monospace;font-weight:600;text-transform:uppercase;letter-spacing:.12em;font-size:15px;padding:20px 38px;border-radius:999px;transition:transform .1s}
.btn:active{transform:scale(.96)}.btn.ghost{background:none;color:var(--fg);border:1px solid #333}.btn.red{background:var(--wolf);color:#000}
.btn:disabled{opacity:.35}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
input.f{background:#111;border:1px solid #2c2c2c;border-radius:16px;padding:18px 20px;font-size:22px;width:min(420px,88vw);outline:none;text-align:center}
input.code{font-family:'Anton',sans-serif;font-size:44px;letter-spacing:.3em;text-transform:uppercase}
.code-big{font-family:'Anton',sans-serif;font-size:clamp(70px,14vw,150px);letter-spacing:.18em;color:var(--acc);line-height:1}
.lobby{display:grid;grid-template-columns:auto 1fr;gap:34px;align-items:center;width:100%}
#qr{background:#fff;padding:14px;border-radius:20px;display:inline-block}
#qr img,#qr canvas{display:block;width:220px!important;height:220px!important}
.plist{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pchip{border:1px solid #2c2c2c;border-radius:999px;padding:10px 16px;font-size:18px;display:flex;align-items:center;gap:8px}
.pchip.dead{opacity:.35;text-decoration:line-through}
.pchip .dot{width:9px;height:9px;border-radius:50%;background:#3cff8a}.pchip .dot.off{background:#555}
.pchip .x{color:var(--muted);margin-left:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;width:100%;max-width:720px}
.choice{border:1px solid #2c2c2c;border-radius:18px;padding:20px 12px;font-family:'Anton',sans-serif;font-size:24px;text-transform:uppercase;background:var(--card)}
.choice.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 15%,var(--card));color:var(--acc)}
.choice.wolfsel{border-color:var(--wolf);color:var(--wolf)}
.role{border-radius:28px;padding:30px 24px;width:min(560px,100%);border:2px solid var(--c);background:color-mix(in srgb,var(--c) 10%,#0a0a0a);display:flex;flex-direction:column;gap:12px;align-items:center}
.role .emo{font-size:72px;line-height:1}
.role .rn{font-family:'Anton',sans-serif;font-size:46px;text-transform:uppercase;color:var(--c);line-height:1}
.task{border:2px dashed var(--wolf);border-radius:20px;padding:18px;max-width:560px}
.task b{display:block;font-family:'Anton',sans-serif;font-weight:400;font-size:28px;text-transform:uppercase;color:var(--wolf);margin-top:6px;line-height:1.1}
.timer{font-family:'Anton',sans-serif;font-size:clamp(70px,14vw,140px);font-variant-numeric:tabular-nums;line-height:1}
.hide{filter:blur(18px)}
.peek{border:1px solid #333;border-radius:999px;padding:12px 20px;font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.bar{height:8px;background:#1a1a1a;border-radius:9px;overflow:hidden;width:min(520px,90vw)}.bar i{display:block;height:100%;background:var(--acc)}
.small{font-size:14px;color:var(--muted)}
.tbtn{border:1px solid #2c2c2c;border-radius:999px;padding:11px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.seg{display:flex;border:1px solid #2c2c2c;border-radius:999px;overflow:hidden}.seg button{padding:10px 14px;font-size:14px;color:var(--muted)}.seg button.on{background:#ededed;color:#000}
.log{font-size:15px;color:var(--muted);max-width:640px;line-height:1.6}
.err{color:var(--wolf)}
@media(max-width:760px){.lobby{grid-template-columns:1fr;justify-items:center}}
</style>
</head>
<body>
<div class="top"><a href="./" class="tbtn" style="text-decoration:none" id="home">← Zwijnerij</a><div class="brand">Weer<i>wolven</i></div><div class="mono" id="me"></div></div>
<main id="app"><div class="hint">Laden…</div></main>
<script>
/* ===== basis ===== */
const SB_URL='https://koenqjuwnngluqxseodq.supabase.co',SB_KEY='sb_publishable_FV0_pSspnXUlZXFES5Ga4w_gzlX2kFm';
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const ls={get:(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const rid=()=>Math.random().toString(36).slice(2,10);
const say=t=>{try{const u=new SpeechSynthesisUtterance(t);u.lang='nl-BE';u.rate=.92;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};
let actx;const beep=(f=660,d=.08)=>{try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;g.gain.setValueAtTime(.15,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}};
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate([80,60,80])}catch(e){}};
let wl=null;const wake=async()=>{try{if('wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>wl=null)}}catch(e){}};document.addEventListener('click',wake);

/* ===== versleuteling: rollen en stemmen zijn enkel voor jezelf leesbaar ===== */
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))),unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const genKeys=async()=>{const k=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveKey']);const pub=b64(await crypto.subtle.exportKey('raw',k.publicKey));const priv=await crypto.subtle.exportKey('jwk',k.privateKey);return{pub,priv}};
const derive=async(privJwk,pubB64)=>{const priv=await crypto.subtle.importKey('jwk',privJwk,{name:'ECDH',namedCurve:'P-256'},false,['deriveKey']);
  const pub=await crypto.subtle.importKey('raw',unb64(pubB64),{name:'ECDH',namedCurve:'P-256'},false,[]);
  return crypto.subtle.deriveKey({name:'ECDH',public:pub},priv,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])};
const enc=async(key,obj)=>{const iv=crypto.getRandomValues(new Uint8Array(12));const d=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj)));return{iv:b64(iv),d:b64(d)}};
const dec=async(key,m)=>JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(m.iv)},key,unb64(m.d))));

/* ===== rollen & opdrachten ===== */
const ROLES={
 wolf:{n:'Weerwolf',e:'🐺',c:'#ff4d6d',d:'Elke nacht kies je met de andere weerwolven een slachtoffer. Overdag doe je alsof je een gewone burger bent, en voer je stiekem je geheime opdracht uit.'},
 seer:{n:'Ziener',e:'🔮',c:'#b388ff',d:'Elke nacht mag je bij één speler kijken of het een weerwolf is. Gebruik die kennis slim, zonder jezelf te verraden.'},
 doc:{n:'Dokter',e:'🩺',c:'#3cff8a',d:'Elke nacht kies je iemand om te beschermen. Wordt die aangevallen, dan overleeft hij. Jezelf beschermen mag, maar niet twee nachten na elkaar dezelfde persoon.'},
 hunter:{n:'Jager',e:'🎯',c:'#ffb703',d:'Ga je dood, dan mag je meteen nog één iemand meenemen in je val.'},
 vil:{n:'Burger',e:'🧑‍🌾',c:'#7aa2ff',d:'Geen speciale kracht, wel een stem. Let goed op: de weerwolven moeten overdag een geheime opdracht uitvoeren. Betrap ze.'}};
const TASKS=["Zeg minstens twee keer ‘eerlijk gezegd’","Beschuldig iemand zonder enige reden, met volle overtuiging","Raak drie keer je oor aan terwijl iemand anders praat","Gebruik ‘joegnee’ in een zin","Neem een slok telkens iemand jouw naam zegt","Verdedig de persoon die het meest verdacht wordt","Stel minstens twee vragen aan dezelfde persoon","Zeg ‘dat vind ik verdacht’ over iemand die niets zegt","Lach één keer heel hard om iets dat niet grappig is","Zit vanaf nu met gekruiste armen","Noem iemand bij een verkeerde naam","Begin een zin met ‘Als ik weerwolf was…’","Zeg een voetbalclub in een zin die er niets mee te maken heeft","Kijk de hele ronde niemand recht aan","Herhaal het laatste woord van iemand anders, als een echo","Doe alsof je heel zeker bent van wie de weerwolf is, maar noem geen naam","Gebruik het woord ‘eigenlijk’ minstens drie keer","Wijs naar iemand als je praat","Zeg dat je gisteren slecht geslapen hebt","Stel voor om op de stilste persoon te stemmen"];
const VTIPS=["De weerwolven hebben elk een geheime opdracht. Let op rare zinnen en tics.","Wie zegt opvallend vaak hetzelfde woord?","Wie verdedigt plots iemand die heel verdacht is?","Let op wie zijn oren, neus of armen aanraakt.","Stilte kan verdacht zijn, maar praatjesmakers ook."];

/* ===== realtime ===== */
const sb=window.supabase?window.supabase.createClient(SB_URL,SB_KEY,{realtime:{params:{eventsPerSecond:20}}}):null;
let ch=null;
const join=(code,pid,meta,onMsg,onSync)=>new Promise(res=>{ch=sb.channel('ww-'+code,{config:{broadcast:{self:false},presence:{key:pid}}});
  ch.on('broadcast',{event:'m'},({payload})=>onMsg(payload));
  ch.on('presence',{event:'sync'},()=>onSync&&onSync(ch.presenceState()));
  ch.subscribe(async s=>{if(s==='SUBSCRIBED'){await ch.track(meta);res()}})});
const send=p=>ch&&ch.send({type:'broadcast',event:'m',payload:p});

/* ============================================================
   SPELLEIDER (iPad)
   ============================================================ */
const H={code:null,keys:null,players:{},order:[],keyCache:{},phase:'lobby',round:0,cfg:{wolves:0,seer:true,doc:true,hunter:false,talk:180},night:{},votes:{},lastSave:null,log:[],timerEnd:0,winner:null,online:{}};
const saveH=()=>ls.set('ww_host',{code:H.code,keys:H.keys,players:H.players,order:H.order,phase:H.phase,round:H.round,cfg:H.cfg,night:H.night,votes:H.votes,lastSave:H.lastSave,log:H.log,timerEnd:H.timerEnd,winner:H.winner,t:Date.now()});
const pkey=async pid=>H.keyCache[pid]||(H.keyCache[pid]=await derive(H.keys.priv,H.players[pid].pub));
const alive=()=>H.order.filter(p=>H.players[p]&&H.players[p].alive);
const pub=()=>({t:'state',phase:H.phase,round:H.round,hostPub:H.keys.pub,code:H.code,players:H.order.map(p=>({id:p,n:H.players[p].n,alive:H.players[p].alive,role:(H.phase==='end'||!H.players[p].alive)?H.players[p].role:null})),
  timerEnd:H.timerEnd,winner:H.winner,lastNews:H.log.slice(-1)[0]||null,votesIn:Object.keys(H.votes).length,nightIn:Object.keys(H.night).length});
const broadcast=()=>{send(pub());saveH();renderHost()};
const priv=async pid=>{const p=H.players[pid];if(!p||!p.pub)return;const k=await pkey(pid);
  const a=alive(),others=a.filter(x=>x!==pid).map(x=>({id:x,n:H.players[x].n}));
  const o={role:p.role,alive:p.alive,phase:H.phase,round:H.round};
  if(p.role==='wolf'){o.mates=H.order.filter(x=>x!==pid&&H.players[x].role==='wolf').map(x=>H.players[x].n);o.task=p.task}
  if(p.role==='seer')o.seen=p.seen||[];
  if(H.phase==='night'&&p.alive){o.choices=p.role==='wolf'?a.filter(x=>H.players[x].role!=='wolf').map(x=>({id:x,n:H.players[x].n})):p.role==='doc'?a.filter(x=>x!==p.lastDoc).map(x=>({id:x,n:H.players[x].n})):others;
    o.done=!!H.night[pid];if(p.role==='wolf'){o.wolfVotes=Object.entries(H.night).filter(([k,v])=>v.kind==='wolf').map(([k,v])=>({by:H.players[k].n,to:H.players[v.target]?.n}))}}
  if(H.phase==='vote'&&p.alive){o.choices=others;o.done=!!H.votes[pid]}
  if(H.phase==='hunter'&&p.role==='hunter'&&H.hunterPid===pid){o.hunt=true;o.choices=others}
  send({t:'priv',to:pid,...await enc(k,o)})};
const privAll=()=>H.order.forEach(priv);
const onHostMsg=async m=>{
  if(m.t==='join'){const ex=H.players[m.pid];
    if(!ex){if(H.phase!=='lobby'){send({t:'reject',to:m.pid,why:'Het spel is al bezig. Wacht op de volgende ronde.'});return}
      H.players[m.pid]={n:m.n.slice(0,16),pub:m.pub,alive:true,role:null};H.order.push(m.pid);beep(880)}
    else{if(ex.pub!==m.pub){ex.pub=m.pub;delete H.keyCache[m.pid]}ex.n=m.n.slice(0,16)}
    broadcast();priv(m.pid);return}
  if(m.t==='act'&&H.players[m.pid]){let a;try{a=await dec(await pkey(m.pid),m)}catch(e){return}hostAct(m.pid,a)}
  if(m.t==='hello'){send(pub());priv(m.pid)}};
const hostAct=(pid,a)=>{const p=H.players[pid];
  if(H.phase==='night'&&p.alive&&a.kind==='night'){H.night[pid]={kind:p.role==='wolf'?'wolf':p.role,target:a.target};beep(700);
    if(p.role==='seer'&&H.players[a.target]){p.seen=(p.seen||[]).concat([{n:H.players[a.target].n,wolf:H.players[a.target].role==='wolf'}])}
    if(p.role==='wolf')H.order.filter(x=>H.players[x].role==='wolf').forEach(priv);else priv(pid);
    broadcast();if(nightDone())timers.night=setTimeout(resolveNight,1500);return}
  if(H.phase==='vote'&&p.alive&&a.kind==='vote'){H.votes[pid]=a.target;beep(700);priv(pid);broadcast();if(Object.keys(H.votes).length>=alive().length)setTimeout(resolveVote,1200);return}
  if(H.phase==='hunter'&&pid===H.hunterPid&&a.kind==='hunt'){const t=H.players[a.target];if(t&&t.alive){t.alive=false;H.log.push(`🎯 ${p.n} schiet ${t.n} neer. ${t.n} was ${ROLES[t.role].n}. Drink!`);say(`De jager neemt ${t.n} mee in zijn val.`)}
    H.hunterPid=null;afterDeaths(H.hunterNext)}};
const timers={};
const nightDone=()=>alive().every(p=>H.night[p]);
const makeCode=()=>Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0]).join('');
const startHost=async(resume)=>{
  const s=ls.get('ww_host',null);
  if(resume&&s&&Date.now()-s.t<6*3.6e6){Object.assign(H,s);H.keyCache={}}else{H.code=makeCode();H.keys=await genKeys();H.players={};H.order=[];H.phase='lobby';H.log=[];H.round=0;H.winner=null}
  $('#me').textContent='Spelleider';
  await join(H.code,'host',{host:true},onHostMsg,st=>{H.online={};Object.keys(st).forEach(k=>H.online[k]=true);renderHost()});
  broadcast();privAll()};
const assign=()=>{const ids=shuf(H.order),n=ids.length;let w=H.cfg.wolves||Math.max(1,Math.round(n/4.5));
  const roles=[];for(let i=0;i<w;i++)roles.push('wolf');if(H.cfg.seer&&n>=4)roles.push('seer');if(H.cfg.doc&&n>=5)roles.push('doc');if(H.cfg.hunter&&n>=6)roles.push('hunter');while(roles.length<n)roles.push('vil');
  const tasks=shuf(TASKS);ids.forEach((id,i)=>{const p=H.players[id];p.role=roles[i];p.alive=true;p.seen=[];p.lastDoc=null;p.task=p.role==='wolf'?tasks[i%tasks.length]:null})};
const goNight=()=>{H.phase='night';H.round++;H.night={};H.votes={};document.body.classList.add('night');
  say(`Nacht ${H.round}. Iedereen ogen dicht. Weerwolven, ziener en dokter: kies op je gsm. Burgers: tik ook iets aan, zodat niemand iets merkt.`);broadcast();privAll()};
const resolveNight=()=>{clearTimeout(timers.night);if(H.phase!=='night')return;
  const wv={};Object.values(H.night).filter(v=>v.kind==='wolf').forEach(v=>wv[v.target]=(wv[v.target]||0)+1);
  const max=Math.max(0,...Object.values(wv)),cands=Object.keys(wv).filter(k=>wv[k]===max);const victim=cands.length?cands[Math.random()*cands.length|0]:null;
  const docE=Object.entries(H.night).find(([k,v])=>v.kind==='doc');const saved=docE?docE[1].target:null;if(docE)H.players[docE[0]].lastDoc=saved;
  const deaths=[];let news;
  if(victim&&victim!==saved){H.players[victim].alive=false;deaths.push(victim);news=`☠️ ${H.players[victim].n} is vannacht verscheurd. Rol: ${ROLES[H.players[victim].role].n}. Drink een ad fundum ter ere van ${H.players[victim].n}.`}
  else if(victim){news=`🩺 De weerwolven sloegen toe, maar de dokter was er op tijd bij. Niemand dood. De dokter mag 2 slokken uitdelen.`}
  else news='🌙 Een rustige nacht. Niemand werd aangevallen.';
  H.log.push(news);document.body.classList.remove('night');
  say(news.replace(/[☠️🩺🌙]/g,''));afterDeaths('day',deaths)};
const afterDeaths=(next,deaths=[])=>{const h=deaths.find(d=>H.players[d].role==='hunter');
  if(h&&H.cfg.hunter){H.phase='hunter';H.hunterPid=h;H.hunterNext=next;broadcast();privAll();return}
  if(checkWin())return;if(next==='day'){H.phase='day';H.timerEnd=Date.now()+H.cfg.talk*1000;broadcast();privAll();tickTalk()}else goNight()};
const tickTalk=()=>{clearInterval(timers.talk);timers.talk=setInterval(()=>{if(H.phase!=='day'){clearInterval(timers.talk);return}const l=Math.round((H.timerEnd-Date.now())/1000);
  const t=$('#ht');if(t)t.textContent=fmt(l);if(l===30)say('Nog dertig seconden.');if(l<=0){clearInterval(timers.talk);goVote()}},500)};
const fmt=s=>{s=Math.max(0,s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const goVote=()=>{clearInterval(timers.talk);H.phase='vote';H.votes={};say('Tijd om te stemmen. Kies op je gsm wie je ophangt.');broadcast();privAll()};
const resolveVote=()=>{if(H.phase!=='vote')return;const c={};Object.values(H.votes).forEach(v=>c[v]=(c[v]||0)+1);const max=Math.max(0,...Object.values(c)),top=Object.keys(c).filter(k=>c[k]===max);
  let news,deaths=[];
  if(top.length!==1){news=`⚖️ Gelijkstand (${top.map(t=>H.players[t].n).join(' en ')}). Niemand wordt opgehangen. Iedereen die stemde op ${top.map(t=>H.players[t].n).join(' of ')} drinkt 1.`}
  else{const v=top[0],p=H.players[v];p.alive=false;deaths.push(v);
    news=p.role==='wolf'?`🐺 ${p.n} werd opgehangen en was een WEERWOLF! Ad fundum voor ${p.n}. Opdracht was: “${p.task}”.`:`😬 ${p.n} werd opgehangen, maar was ${ROLES[p.role].n}. Iedereen die op ${p.n} stemde, drinkt 2.`}
  H.log.push(news);say(news.replace(/[⚖️🐺😬]/g,'').replace(/[“”]/g,''));H.phase='reveal';broadcast();privAll();H.pendingDeaths=deaths};
const checkWin=()=>{const a=alive(),w=a.filter(p=>H.players[p].role==='wolf').length,v=a.length-w;
  if(w===0){H.winner='village'}else if(w>=v){H.winner='wolves'}else return false;
  H.phase='end';document.body.classList.remove('night');say(H.winner==='village'?'Het dorp wint! Alle weerwolven zijn gevonden. Weerwolven: ad fundum.':'De weerwolven winnen! Het dorp is opgegeten. Burgers: ad fundum.');broadcast();privAll();return true};
const renderHost=()=>{const P=H.order.map(id=>({id,...H.players[id]}));
  const chips=P.map(p=>`<span class="pchip ${p.alive||H.phase==='lobby'?'':'dead'}"><span class="dot ${H.online[p.id]?'':'off'}"></span>${esc(p.n)}${(H.phase==='end'||(!p.alive&&H.phase!=='lobby'))&&p.role?' · '+ROLES[p.role].e:''}${H.phase==='lobby'?`<span class="x" data-kick="${p.id}">✕</span>`:''}</span>`).join('');
  const url=location.origin+location.pathname+'?c='+H.code;
  if(H.phase==='lobby'){const n=P.length,w=H.cfg.wolves||Math.max(1,Math.round(n/4.5));
    app.innerHTML=`<div class="lobby"><div><div id="qr"></div><div class="small" style="margin-top:10px">Scan met je gsm</div></div>
      <div style="display:flex;flex-direction:column;gap:16px;align-items:flex-start;text-align:left"><div class="mono">Ga naar de lobby met code</div><div class="code-big">${H.code}</div>
      <div class="small">Of open <b>${esc(location.host+location.pathname)}</b> op je gsm en vul de code in.</div>
      <div class="plist" style="justify-content:flex-start">${chips||'<span class="small">Nog niemand binnen…</span>'}</div></div></div>
      <div class="row"><span class="mono">Weerwolven</span><div class="seg">${[0,1,2,3].map(k=>`<button data-w="${k}" class="${H.cfg.wolves===k?'on':''}">${k===0?'Auto ('+w+')':k}</button>`).join('')}</div></div>
      <div class="row"><span class="mono">Rollen</span>${['seer','doc','hunter'].map(r=>`<button class="tbtn" data-r="${r}" style="${H.cfg[r]?'background:#ededed;color:#000':''}">${ROLES[r].e} ${ROLES[r].n}</button>`).join('')}
        <span class="mono" style="margin-left:10px">Praattijd</span><div class="seg">${[120,180,300].map(s=>`<button data-t="${s}" class="${H.cfg.talk===s?'on':''}">${s/60} min</button>`).join('')}</div></div>
      <button class="btn" id="go" ${n<4?'disabled':''}>Start (${n} spelers${n<4?', min. 4':''})</button>`;
    try{new QRCode($('#qr'),{text:url,width:220,height:220,correctLevel:QRCode.CorrectLevel.M})}catch(e){$('#qr').innerHTML='<div style="color:#000;padding:20px">QR niet geladen</div>'}
    app.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{H.cfg.wolves=+b.dataset.w;broadcast()});
    app.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{H.cfg[b.dataset.r]=!H.cfg[b.dataset.r];broadcast()});
    app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{H.cfg.talk=+b.dataset.t;broadcast()});
    app.querySelectorAll('[data-kick]').forEach(b=>b.onclick=()=>{const id=b.dataset.kick;delete H.players[id];H.order=H.order.filter(x=>x!==id);send({t:'reject',to:id,why:'Je werd uit de lobby verwijderd.'});broadcast()});
    $('#go').onclick=()=>{assign();H.phase='roles';say('De rollen zijn verdeeld. Bekijk stiekem je gsm.');broadcast();privAll()};return}
  if(H.phase==='roles'){app.innerHTML=`<div class="h1">Bekijk je rol</div><div class="hint">Iedereen kijkt stiekem op zijn eigen gsm. Weerwolven zien wie hun maten zijn en krijgen een geheime opdracht voor elke dagronde.</div><div class="plist">${chips}</div><button class="btn" id="n">Iedereen klaar: de nacht valt</button>`;$('#n').onclick=goNight;return}
  if(H.phase==='night'){const need=alive().length,inn=Object.keys(H.night).length;
    app.innerHTML=`<div style="font-size:80px">🌙</div><div class="h1">Nacht ${H.round}</div><div class="hint">Iedereen ogen dicht, behalve om je gsm te bedienen. Ook burgers tikken iets aan, zodat niemand opvalt.</div>
      <div class="bar"><i style="width:${need?inn/need*100:0}%"></i></div><div class="mono">${inn} / ${need} gekozen</div><button class="tbtn" id="f">Forceer ochtend</button>`;$('#f').onclick=resolveNight;return}
  if(H.phase==='hunter'){app.innerHTML=`<div style="font-size:80px">🎯</div><div class="h1">De jager valt…</div><div class="hint">${esc(H.players[H.hunterPid].n)} was de jager en kiest nu op zijn gsm wie hij meeneemt.</div>`;return}
  if(H.phase==='day'){const l=Math.round((H.timerEnd-Date.now())/1000);
    app.innerHTML=`<div class="mono">Dag ${H.round}</div><div class="h2" style="max-width:900px">${esc(H.log.slice(-1)[0]||'')}</div><div class="timer" id="ht">${fmt(l)}</div>
      <div class="hint">Discussieer: wie is de weerwolf? <b style="color:var(--wolf)">${esc(VTIPS[H.round%VTIPS.length])}</b></div><div class="plist">${chips}</div>
      <div class="row"><button class="tbtn" id="ex">+1 minuut</button><button class="btn" id="v">Nu stemmen</button></div>`;
    $('#ex').onclick=()=>{H.timerEnd+=60000;broadcast()};$('#v').onclick=goVote;return}
  if(H.phase==='vote'){const need=alive().length,inn=Object.keys(H.votes).length;
    app.innerHTML=`<div style="font-size:70px">🗳️</div><div class="h1">Stemmen</div><div class="hint">Iedereen stemt op zijn gsm. Het resultaat komt pas als iedereen gestemd heeft.</div>
      <div class="bar"><i style="width:${need?inn/need*100:0}%"></i></div><div class="mono">${inn} / ${need} stemmen</div><button class="tbtn" id="f">Stemming afsluiten</button>`;$('#f').onclick=resolveVote;return}
  if(H.phase==='reveal'){app.innerHTML=`<div class="h2" style="max-width:900px">${esc(H.log.slice(-1)[0])}</div><div class="plist">${chips}</div><button class="btn" id="n">Verder</button>`;
    $('#n').onclick=()=>afterDeaths('night',H.pendingDeaths||[]);return}
  if(H.phase==='end'){app.innerHTML=`<div style="font-size:90px">${H.winner==='village'?'🏡':'🐺'}</div><div class="h1">${H.winner==='village'?'Het dorp wint':'De weerwolven winnen'}</div>
      <div class="hint">${H.winner==='village'?'Alle weerwolven zijn ontmaskerd. Weerwolven: ad fundum.':'De weerwolven hebben het dorp opgegeten. Alle burgers: ad fundum.'}</div>
      <div class="plist">${P.map(p=>`<span class="pchip">${ROLES[p.role].e} ${esc(p.n)} · ${ROLES[p.role].n}${p.role==='wolf'?` <span class="small">(“${esc(p.task)}”)</span>`:''}</span>`).join('')}</div>
      <div class="log">${H.log.map(esc).join('<br>')}</div>
      <div class="row"><button class="btn" id="again">Nieuw spel, zelfde groep</button><button class="tbtn" id="new">Nieuwe lobby</button><a class="btn ghost" href="./" style="text-decoration:none">Terug naar Zwijnerij</a></div>`;
    $('#again').onclick=()=>{H.order.forEach(id=>{H.players[id].alive=true;H.players[id].role=null});H.phase='lobby';H.round=0;H.log=[];H.winner=null;broadcast();privAll()};
    $('#new').onclick=()=>{ls.set('ww_host',null);location.href=location.pathname+'?host=1'};return}};

/* ============================================================
   SPELER (gsm)
   ============================================================ */
const Pl={pid:null,n:'',keys:null,key:null,code:null,state:null,mine:null,sel:null,peek:false};
const startPlayer=async code=>{Pl.code=code.toUpperCase();const st=ls.get('ww_p_'+Pl.code,null);
  Pl.pid=st?.pid||rid();Pl.keys=st?.keys||await genKeys();Pl.n=st?.n||ls.get('ww_name','');
  if(!Pl.n){askName();return}
  ls.set('ww_p_'+Pl.code,{pid:Pl.pid,keys:Pl.keys,n:Pl.n});ls.set('ww_name',Pl.n);$('#me').textContent=Pl.n;
  app.innerHTML=`<div class="h2">Verbinden…</div>`;
  await join(Pl.code,Pl.pid,{n:Pl.n},onPlayerMsg);send({t:'join',pid:Pl.pid,n:Pl.n,pub:Pl.keys.pub});
  setTimeout(()=>{if(!Pl.state)app.innerHTML=`<div class="h2">Lobby ${Pl.code} niet gevonden</div><div class="hint">Klopt de code? Staat de spelleider zijn iPad open?</div><button class="btn" onclick="location.href=location.pathname">Andere code</button>`},6000)};
const askName=()=>{app.innerHTML=`<div class="mono">Lobby ${esc(Pl.code)}</div><div class="h1">Hoe heet je?</div><input class="f" id="nm" maxlength="16" placeholder="Je naam" autocomplete="off"><button class="btn" id="ok">Doe mee</button>`;
  const go=()=>{const v=$('#nm').value.trim();if(!v)return;Pl.n=v;ls.set('ww_name',v);startPlayer(Pl.code)};$('#ok').onclick=go;$('#nm').onkeydown=e=>{if(e.key==='Enter')go()};$('#nm').focus()};
const onPlayerMsg=async m=>{
  if(m.t==='state'){const first=!Pl.state;Pl.state=m;if(!Pl.key||Pl.hostPub!==m.hostPub){Pl.hostPub=m.hostPub;Pl.key=await derive(Pl.keys.priv,m.hostPub)}if(first)send({t:'join',pid:Pl.pid,n:Pl.n,pub:Pl.keys.pub});renderPlayer();return}
  if(m.t==='priv'&&m.to===Pl.pid&&Pl.key){try{const prev=Pl.mine;Pl.mine=await dec(Pl.key,m);if(!prev||prev.phase!==Pl.mine.phase){Pl.sel=null;buzz()}renderPlayer()}catch(e){}return}
  if(m.t==='reject'&&m.to===Pl.pid){app.innerHTML=`<div class="h2">${esc(m.why)}</div><button class="btn" onclick="location.href=location.pathname">Terug</button>`}};
const act=async(kind,target)=>{const e=await enc(Pl.key,{kind,target});send({t:'act',pid:Pl.pid,...e});beep(880)};
const roleCard=(r,small)=>`<div class="role" style="--c:${ROLES[r].c}"><div class="emo">${ROLES[r].e}</div><div class="mono">Jouw rol</div><div class="rn">${ROLES[r].n}</div>${small?'':`<div class="hint" style="color:#cfcfcf">${ROLES[r].d}</div>`}</div>`;
const renderPlayer=()=>{const s=Pl.state,me=Pl.mine;if(!s){return}
  document.body.classList.toggle('night',s.phase==='night');
  if(s.phase==='lobby'){app.innerHTML=`<div class="mono">Lobby ${esc(s.code)}</div><div class="h1">Je zit erin</div><div class="hint">Wacht tot de spelleider start. Leg je gsm alvast met het scherm naar beneden zodra je je rol kent.</div><div class="plist">${s.players.map(p=>`<span class="pchip">${esc(p.n)}${p.id===Pl.pid?' (jij)':''}</span>`).join('')}</div>`;return}
  if(!me||!me.role){app.innerHTML=`<div class="h2">Even wachten…</div>`;send({t:'hello',pid:Pl.pid});return}
  const peekBtn=`<button class="peek" id="pk">${Pl.peek?'Verberg mijn rol':'Toon mijn rol'}</button>`;
  const hidden=`<div class="${Pl.peek?'':'hide'}" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:14px">${roleCard(me.role,true)}
    ${me.mates&&me.mates.length?`<div class="small">Mede-weerwolven: <b style="color:var(--wolf)">${me.mates.map(esc).join(', ')}</b></div>`:''}
    ${me.seen&&me.seen.length?`<div class="small">Gezien: ${me.seen.map(x=>`${esc(x.n)} ${x.wolf?'🐺':'✅'}`).join(' · ')}</div>`:''}</div>`;
  const bindPeek=()=>{const b=$('#pk');if(b)b.onclick=()=>{Pl.peek=!Pl.peek;renderPlayer()}};
  if(!me.alive&&s.phase!=='end'){app.innerHTML=`<div style="font-size:80px">💀</div><div class="h1">Je bent dood</div><div class="hint">Zeg niets meer over het spel. Drink en kijk toe. Je rol was:</div>${roleCard(me.role,true)}`;return}
  if(s.phase==='roles'){app.innerHTML=`${roleCard(me.role)}${me.mates?`<div class="hint">Jouw roedel: <b style="color:var(--wolf)">${me.mates.length?me.mates.map(esc).join(', '):'je bent de enige weerwolf'}</b></div>`:''}
    ${me.role==='wolf'?`<div class="task"><span class="mono">Je geheime opdracht overdag</span><b>${esc(me.task)}</b><div class="small" style="margin-top:8px">Doe dit in elke praatronde. De burgers weten dat je zo'n opdracht hebt…</div></div>`:''}
    <div class="small">Hou je gsm verborgen. Straks verschijnt je rol vervaagd, en met “Toon mijn rol” kijk je stiekem.</div>`;return}
  if(s.phase==='night'){
    if(me.done){app.innerHTML=`<div style="font-size:70px">😴</div><div class="h1">Slaap zacht</div><div class="hint">Je keuze is doorgegeven. Ogen dicht.</div>
      ${me.role==='wolf'&&me.wolfVotes?`<div class="small">Roedel: ${me.wolfVotes.map(v=>esc(v.by)+' → '+esc(v.to||'?')).join(' · ')}</div>`:''}${me.role==='seer'&&me.seen?.length?`<div class="h2">${esc(me.seen.slice(-1)[0].n)} is ${me.seen.slice(-1)[0].wolf?'<span style="color:var(--wolf)">een weerwolf 🐺</span>':'geen weerwolf ✅'}</div>`:''}`;return}
    const q={wolf:'Wie verscheuren jullie vannacht?',seer:'Bij wie wil je kijken?',doc:'Wie bescherm je vannacht?',hunter:'Wie vind jij verdacht?',vil:'Wie vind jij verdacht?'}[me.role];
    app.innerHTML=`${peekBtn}${hidden}<div class="mono">Nacht ${s.round}</div><div class="h2">${q}</div>
      ${me.role==='wolf'&&me.wolfVotes?.length?`<div class="small">Roedel koos al: ${me.wolfVotes.map(v=>esc(v.by)+' → '+esc(v.to)).join(' · ')}</div>`:''}
      <div class="grid">${(me.choices||[]).map(c=>`<button class="choice ${Pl.sel===c.id?(me.role==='wolf'?'sel wolfsel':'sel'):''}" data-c="${c.id}">${esc(c.n)}</button>`).join('')}</div>
      <button class="btn ${me.role==='wolf'?'red':''}" id="cf" ${Pl.sel?'':'disabled'}>Bevestig</button>`;
    bindPeek();app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{Pl.sel=b.dataset.c;renderPlayer()});$('#cf').onclick=()=>{if(Pl.sel)act('night',Pl.sel)};return}
  if(s.phase==='hunter'){if(me.hunt){app.innerHTML=`<div class="h1">🎯 Neem iemand mee</div><div class="grid">${me.choices.map(c=>`<button class="choice" data-c="${c.id}">${esc(c.n)}</button>`).join('')}</div>`;app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>act('hunt',b.dataset.c))}
    else app.innerHTML=`<div class="h2">De jager kiest…</div>`;return}
  if(s.phase==='day'){app.innerHTML=`${peekBtn}${hidden}<div class="mono">Dag ${s.round}</div><div class="hint">${esc(s.lastNews||'')}</div>
      ${me.role==='wolf'?`<div class="task ${Pl.peek?'':'hide'}"><span class="mono">Geheime opdracht deze ronde</span><b>${esc(me.task)}</b></div>`:`<div class="task" style="border-color:#7aa2ff"><span class="mono">Tip</span><b style="color:#7aa2ff;font-size:22px">${esc(VTIPS[s.round%VTIPS.length])}</b></div>`}
      <div class="small">Discussieer aan tafel. Stemmen gebeurt straks op je gsm.</div>`;bindPeek();return}
  if(s.phase==='vote'){if(me.done){app.innerHTML=`<div style="font-size:70px">🗳️</div><div class="h1">Stem uitgebracht</div><div class="hint">Wachten op de rest…</div>`;return}
    app.innerHTML=`<div class="mono">Stemming</div><div class="h2">Wie hangen we op?</div><div class="grid">${(me.choices||[]).map(c=>`<button class="choice ${Pl.sel===c.id?'sel':''}" data-c="${c.id}">${esc(c.n)}</button>`).join('')}</div><button class="btn" id="cf" ${Pl.sel?'':'disabled'}>Stem</button>`;
    app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{Pl.sel=b.dataset.c;renderPlayer()});$('#cf').onclick=()=>{if(Pl.sel)act('vote',Pl.sel)};return}
  if(s.phase==='reveal'){app.innerHTML=`<div class="h2">${esc(s.lastNews||'')}</div><div class="hint">Kijk naar de iPad.</div>`;return}
  if(s.phase==='end'){app.innerHTML=`<div style="font-size:80px">${s.winner==='village'?'🏡':'🐺'}</div><div class="h1">${s.winner==='village'?'Het dorp wint':'De weerwolven winnen'}</div>
    ${roleCard(me.role,true)}<div class="h2" style="color:${(s.winner==='village')===(me.role!=='wolf')?'var(--acc)':'var(--wolf)'}">${(s.winner==='village')===(me.role!=='wolf')?'Gewonnen!':'Verloren: ad fundum'}</div>`;return}};

/* ===== start ===== */
const landing=()=>{app.innerHTML=`<div style="font-size:80px">🐺</div><div class="h1">Weerwolven</div><div class="hint">Vul de code in die op de iPad staat.</div>
  <input class="f code" id="cd" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters"><button class="btn" id="jn">Naar de lobby</button>
  <button class="tbtn" id="hs">Ik ben de spelleider (iPad)</button>`;
  const go=()=>{const c=$('#cd').value.trim().toUpperCase();if(c.length===4)location.href=location.pathname+'?c='+c};$('#jn').onclick=go;$('#cd').onkeydown=e=>{if(e.key==='Enter')go()};
  $('#hs').onclick=()=>location.href=location.pathname+'?host=1'};
(async()=>{if(!sb){app.innerHTML='<div class="h2 err">Geen internet: Weerwolven heeft een verbinding nodig.</div>';return}
  if(!window.crypto||!crypto.subtle){app.innerHTML='<div class="h2 err">Open deze pagina via https.</div>';return}
  const q=new URLSearchParams(location.search);
  if(q.get('host')){const s=ls.get('ww_host',null);if(s&&s.phase&&s.phase!=='lobby'&&s.phase!=='end'&&Date.now()-s.t<6*3.6e6&&!q.get('new')){
      app.innerHTML=`<div class="h2">Er loopt nog een spel (code ${esc(s.code)})</div><div class="row"><button class="btn" id="rs">Verder spelen</button><button class="tbtn" id="nw">Nieuw spel</button></div>`;
      $('#rs').onclick=()=>startHost(true);$('#nw').onclick=()=>startHost(false);return}
    startHost(!!(s&&s.phase==='lobby'&&Date.now()-s.t<3.6e6));return}
  if(q.get('c'))return startPlayer(q.get('c'));landing()})();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Pl.pid&&ch)send({t:'hello',pid:Pl.pid})});
</script>
</body>
</html>
