<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zwijnerij">
<meta name="theme-color" content="#070707">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<title>Zwijnerij</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#070707;--line:#1f1f1f;--fg:#ededed;--muted:#6b6b6b;--acc:#d4ff3a;--acct:#d4ff3a;--card:#0c0c0c;--card2:#111;--card3:#1b1b1b;--line2:#2c2c2c;--line3:#3a3a3a;--soft:#bdbdbd;--inv:#ededed;--noise:.07;--navbg:#141414}
  body.light{--bg:#f3f2ec;--line:#dcdad2;--fg:#111;--muted:#77756c;--acc:#c8f000;--acct:#4f6b00;--card:#fbfaf6;--card2:#ecebe4;--card3:#e3e2da;--line2:#cfcdc4;--line3:#b9b7ad;--soft:#3d3c37;--inv:#111;--noise:.035;--navbg:#fbfaf6}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--fg);font-family:'Inter Tight',system-ui,sans-serif;min-height:100vh;
       padding:28px 32px;-webkit-user-select:none;user-select:none;position:relative;overflow-x:hidden}
  body::before{content:none}
  body>*{position:relative;z-index:1}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .mono{font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--muted)}
  header{display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:22px;border-bottom:1px solid var(--line)}
  .brand{font-family:'Anton',sans-serif;font-size:clamp(40px,6vw,72px);line-height:.9;letter-spacing:.01em;text-transform:uppercase}
  .brand i{font-style:normal;color:var(--acct)}
  #clock{font-family:'Anton',sans-serif;font-size:clamp(64px,11vw,132px);line-height:.85;font-variant-numeric:tabular-nums;text-align:right}
  #date{text-align:right;margin-top:8px}
  .sec{display:flex;justify-content:space-between;margin:26px 0 12px}
  .music{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line)}
  .music a{display:flex;flex-direction:column;justify-content:space-between;gap:28px;padding:22px;color:var(--fg);text-decoration:none;
    border-right:1px solid var(--line);transition:background .15s}
  .music a:last-child{border-right:0}
  .music a:active{background:var(--card2)}
  .music .top{display:flex;justify-content:space-between;align-items:center}
  .lg{width:40px;height:40px;fill:var(--c);filter:drop-shadow(0 0 12px color-mix(in srgb,var(--c) 45%,transparent))}
  .ic{width:52px;height:52px;border:1px solid var(--line);border-radius:14px;display:grid;place-items:center;margin-right:18px}
  .ic svg{width:26px;height:26px;fill:none;stroke:var(--acc);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .timer{font-family:'Anton',sans-serif;font-size:clamp(90px,16vw,180px);line-height:.9;font-variant-numeric:tabular-nums;color:var(--acct)}
  #ov.boom{animation:flash .9s ease-out}
  @keyframes flash{0%{background:#ff2b2b}100%{background:var(--bg)}}
  .shake{animation:sh .5s}
  @keyframes sh{0%,100%{transform:none}20%{transform:translate(-14px,6px)}40%{transform:translate(12px,-8px)}60%{transform:translate(-8px,4px)}80%{transform:translate(6px,-2px)}}
  .pulse{width:18px;height:18px;border-radius:50%;background:#ff3b3b;animation:pl var(--sp,1s) infinite}
  @keyframes pl{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
  .music .nm{font-family:'Anton',sans-serif;font-size:clamp(28px,3.6vw,42px);text-transform:uppercase;line-height:1}
  .games{border-top:1px solid var(--line)}
  .game{display:grid;grid-template-columns:auto 1fr auto;align-items:center;width:100%;text-align:left;
    padding:20px 4px;border-bottom:1px solid var(--line);transition:background .15s, padding .15s}
  .game:active{background:var(--card2);padding-left:14px}
  .game .ic{grid-row:1/3}
  .game .nm{font-family:'Anton',sans-serif;font-size:clamp(30px,4.4vw,52px);text-transform:uppercase;line-height:1}
  .game .ar{font-size:28px;color:var(--acct);grid-row:1/3;grid-column:3}
  .game .sub{grid-column:2;margin-top:6px}
  footer{margin-top:26px;display:flex;justify-content:space-between}

  #ov{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;padding:28px 32px;z-index:5}
  #ov.open{display:flex}
  .bar{display:flex;justify-content:space-between;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--line)}
  .back{border:1px solid var(--line);padding:12px 20px;border-radius:999px}
  #gt{font-family:'Anton',sans-serif;font-size:28px;text-transform:uppercase}
  #st{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:30px;text-align:center}
  .pr{font-family:'Anton',sans-serif;font-size:clamp(40px,6.5vw,84px);line-height:1;text-transform:uppercase;max-width:1000px}
  .hint{max-width:640px;font-size:18px;color:var(--muted);line-height:1.4}
  .btn{background:var(--acc);color:#000;font-family:'JetBrains Mono',monospace;font-weight:600;text-transform:uppercase;letter-spacing:.12em;
    font-size:16px;padding:22px 44px;border-radius:999px;transition:transform .1s}
  .btn:active{transform:scale(.96)}
  .btn.ghost{background:none;color:var(--fg);border:1px solid var(--line3)}
  .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  .card{width:min(240px,38vw,24vh);font-size:min(40px,5vh)!important;aspect-ratio:5/7;border:1px solid var(--line3);border-radius:18px;padding:16px;display:flex;flex-direction:column;
    justify-content:space-between;font-family:'Anton',sans-serif;font-size:40px;background:var(--card)}
  .card.red{color:#ff4d4d}
  .card .mid{font-size:100px;text-align:center;line-height:1}
  .card .br{text-align:right;transform:rotate(180deg)}
  .kc{display:flex;gap:8px}
  .kc span{width:34px;height:6px;border-radius:3px;background:var(--line2)}
  .kc span.on{background:var(--acc)}
  #ww{position:relative;width:min(440px,74vw);aspect-ratio:1}
  #wh{width:100%;height:100%;transition:transform 4.5s cubic-bezier(.12,.8,.12,1)}
  #pt{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;
    border-right:14px solid transparent;border-top:28px solid var(--acc);z-index:2}
  .games{display:grid;grid-template-columns:1fr 1fr;column-gap:28px}
  #st{overflow-y:auto;padding:20px 0;justify-content:flex-start!important}
  #st>:first-child{margin-top:auto}#st>:last-child{margin-bottom:auto}
  .tag{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#000;background:var(--acc);padding:4px 10px;border-radius:999px}
  .rules{list-style:none;counter-reset:r;text-align:left;max-width:640px;display:flex;flex-direction:column;gap:14px}
  .rules li{counter-increment:r;display:grid;grid-template-columns:44px 1fr;font-size:20px;line-height:1.4}
  .rules li::before{content:counter(r,decimal-leading-zero);font-family:'JetBrains Mono',monospace;color:var(--acct);font-size:15px;padding-top:4px}
  .meta{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .meta span{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  input.nm{background:var(--card2);border:1px solid var(--line2);color:var(--fg);font:inherit;font-size:20px;padding:14px 18px;border-radius:14px;width:min(360px,70vw);outline:none}
  .chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:700px}
  .chip{border:1px solid var(--line3);border-radius:999px;padding:10px 16px;font-size:18px}
  .dice{display:flex;gap:22px}
  .die{width:120px;height:120px;border:1px solid var(--line3);border-radius:24px;background:var(--card);display:grid;grid-template-columns:repeat(3,1fr);padding:18px;gap:4px}
  .die i{width:20px;height:20px;border-radius:50%;place-self:center;background:transparent}
  .die i.on{background:var(--fg)}
  .roll{animation:rl .45s}
  @keyframes rl{0%{transform:rotate(-25deg) scale(.8)}60%{transform:rotate(10deg) scale(1.08)}100%{transform:none}}
  .track{display:flex;flex-direction:column;gap:10px;width:min(820px,90vw)}
  .lane{display:grid;grid-template-columns:repeat(9,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .lane div{height:58px;border-right:1px solid var(--line);display:grid;place-items:center;font-family:'Anton',sans-serif;font-size:32px}
  .lane div:last-child{border-right:0;background:var(--card2)}
  .lane.red div{color:#ff4d4d}
  .zones{position:absolute;inset:0;display:grid;gap:4px}
  .zone{display:grid;place-items:center;font-family:'Anton',sans-serif;font-size:clamp(30px,5vw,60px);text-transform:uppercase;background:var(--card2);border-radius:18px;touch-action:none}
  .zones.go .zone{background:var(--acc);color:#000}
  .zone.done{background:var(--card3)!important;color:var(--fg)!important}
  .zone.bad{background:#ff3b3b!important;color:#000!important}
  body{padding-bottom:120px;padding-top:calc(env(safe-area-inset-top,0px) + 28px);padding-left:max(32px,env(safe-area-inset-left));padding-right:max(32px,env(safe-area-inset-right))}
  #nav{bottom:calc(env(safe-area-inset-bottom,0px) + 14px)}
  #ov{padding-top:calc(env(safe-area-inset-top,0px) + 24px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);padding-left:max(24px,env(safe-area-inset-left));padding-right:max(24px,env(safe-area-inset-right))}
  #party-ov{padding-top:calc(env(safe-area-inset-top,0px) + 30px)}
  #qs{padding-top:calc(env(safe-area-inset-top,0px) + 90px)!important}
  @media(max-width:600px){#ov{padding-left:16px;padding-right:16px}.bar .back{padding:10px 14px}#gt{font-size:20px}}
  main{max-width:1180px;margin:0 auto}
  header{max-width:1180px;margin:0 auto}
  .tab{display:none;animation:fi .25s ease}
  .tab.on{display:block}
  @keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .music a{min-height:min(46vh,420px)}
  .music .lg{width:72px;height:72px}
  .music .nm{font-size:clamp(36px,4.6vw,58px)}
  #nav{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:6px;padding:8px;border-radius:999px;z-index:4;
    background:var(--navbg);border:1px solid var(--line2);box-shadow:0 20px 50px -20px rgba(0,0,0,.45)}
  #nav button{display:flex;align-items:center;gap:10px;padding:16px 22px;border-radius:999px;font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  #nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  #nav button.on{background:var(--acc);color:#000}
  .pc{border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;background:var(--card)}
  .pcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
  .pc .h{display:flex;justify-content:space-between;align-items:flex-start}
  .pc .nmx{font-family:'Anton',sans-serif;font-size:34px;text-transform:uppercase;line-height:1}
  .bac{font-family:'Anton',sans-serif;font-size:56px;line-height:.9;text-align:right;font-variant-numeric:tabular-nums}
  .dr{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .dr button{border:1px solid var(--line2);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px}
  .dr button b{font-family:'Anton',sans-serif;font-size:22px;font-weight:400}
  .dr button:active{background:var(--acc);color:#000}
  .stat{font-size:15px;color:var(--muted);line-height:1.45}
  .stat b{color:var(--fg);font-weight:600}
  .warn{border-radius:12px;padding:10px 14px;font-size:15px;line-height:1.4}
  .lvl0{background:#12210f;color:#b9f27a}.lvl1{background:#2a230c;color:#ffd166}.lvl2{background:#2e1410;color:#ff8a65}.lvl3{background:#3a0d12;color:#ff5c6c}
  .seg{display:flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden}
  .seg button{padding:8px 14px;font-size:13px;color:var(--muted)}
  .seg button.on,.seg .sg.on{background:var(--inv);color:var(--bg)}
  .seg .sg{padding:8px 14px;font-size:13px;color:var(--muted);cursor:pointer}
  .small{font-size:13px;color:var(--muted)}
  .ibox{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .fact{border:1px solid var(--line);border-radius:22px;padding:22px;background:var(--card)}
  .fact .k{font-family:'Anton',sans-serif;font-size:42px;color:var(--acct);line-height:1;text-transform:uppercase}
  .fact p{margin-top:10px;color:var(--soft);line-height:1.5;font-size:17px}
  .lb{width:100%;border-collapse:collapse;font-size:18px}
  .lb td{padding:16px 10px;border-bottom:1px solid var(--line)}
  .lb td.n{font-family:'Anton',sans-serif;font-size:28px;text-transform:uppercase}
  .turn{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:999px;padding:6px 22px 6px 6px;text-align:left}
  .turn b{font-family:'Anton',sans-serif;font-weight:400;font-size:24px;text-transform:uppercase;line-height:1}
  .av{display:inline-grid;place-items:center;border-radius:50%;background:var(--c);color:#000;font-family:'JetBrains Mono',monospace;font-weight:600;flex:none}
  .accs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;align-items:start}
  .acc{position:relative;border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;align-items:flex-start;gap:16px;background:var(--card);text-align:left;transition:border-color .15s,background .15s}
  .acc.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 9%,var(--card))}
  .acc .nmx{font-family:'Anton',sans-serif;font-size:30px;text-transform:uppercase;line-height:1}
  .acc .st{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .acc.on .st{color:var(--c)}
  .acc .x{position:absolute;top:12px;right:12px;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line2);color:var(--muted);font-size:16px}
  .acc.new{border-style:dashed;align-items:center;justify-content:center;min-height:150px;color:var(--muted)}
  .sw{display:flex;gap:10px;flex-wrap:wrap}
  .sw button{width:40px;height:40px;border-radius:50%;background:var(--c);border:3px solid transparent}
  .sw button.on{border-color:var(--fg)}
  .hstrip{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
  .lvsw{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
  .lvsw button{border:1px solid var(--line);border-radius:22px;padding:20px 22px;text-align:left;background:var(--card);transition:all .15s}
  .lvsw .lvn{font-family:'Anton',sans-serif;font-size:34px;text-transform:uppercase;display:flex;align-items:center;gap:14px;line-height:1}
  .lvsw .lvs{font-size:15px;color:var(--muted);margin-top:8px}
  .lvsw button.on.chill{border-color:#4cc9f0;background:color-mix(in srgb,#4cc9f0 8%,var(--card))}
  .lvsw button.on.hard{border-color:#ff5c6c;background:color-mix(in srgb,#ff5c6c 8%,var(--card))}
  .drops{display:inline-flex;gap:4px}.drops i{width:9px;height:14px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--line2)}
  .chill .drops i.on{background:#4cc9f0}.hard .drops i.on{background:#ff5c6c}
  .qgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(820px,90vw)}
  .qo{border:1px solid var(--line2);border-radius:18px;padding:24px;font-size:22px;text-align:left;background:var(--card)}
  .qo.ok{border-color:#b9f27a;color:#b9f27a;background:#12210f}.qo.no{border-color:#ff5c6c;color:#ff5c6c;background:#2e1410}
  .kop{position:absolute;inset:0;display:grid;grid-template-columns:1fr 2.4fr 1fr;gap:10px}
  .kz{border-radius:22px;font-family:'Anton',sans-serif;font-size:40px;text-transform:uppercase}
  .kz.pas{background:var(--card3);color:var(--muted)}.kz.ok{background:var(--acc);color:#000}
  .kw{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
  body.light .lvl0{background:#e3f5d0;color:#2f6a00}body.light .lvl1{background:#fbefc8;color:#7a5600}body.light .lvl2{background:#fbe0d6;color:#a3300e}body.light .lvl3{background:#f9d4d8;color:#a10f24}
  body.light .water{background:#e2f1fb;border-color:#a9d4ef;color:#0d5c8c}
  body.light .qo.ok{background:#e3f5d0;color:#2f6a00;border-color:#7cc04a}body.light .qo.no{background:#f9d4d8;color:#a10f24;border-color:#e0707f}
  body.light .lg{filter:none}
  body.light .card{box-shadow:0 10px 30px -15px rgba(0,0,0,.25)}
  body.light .kz.pas{color:var(--muted)}
  body.light .ic svg,body.light .drops i.on{stroke:var(--acct)}
  .thm{width:46px;height:46px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;margin-left:auto;margin-bottom:10px}
  .thm svg{width:22px;height:22px;fill:none;stroke:var(--fg);stroke-width:1.8;stroke-linecap:round}
  .teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .team{border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));background:color-mix(in srgb,var(--c) 7%,var(--card));border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px}
  .team.new{border-style:dashed;align-items:center;justify-content:center;color:var(--muted);font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.1em;font-size:13px;min-height:120px;background:none;--c:var(--line)}
  .tn{flex:1;min-width:0;background:none;border:0;border-bottom:1px dashed var(--line2);color:var(--fg);font-family:'Anton',sans-serif;font-size:20px;text-transform:uppercase;padding:4px 6px;margin:0 8px;outline:none}
  .chip .av{vertical-align:middle;margin-right:4px}
  .fles{position:relative;width:min(560px,80vw,62vh);aspect-ratio:1}
  .fn{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;font-family:'Anton',sans-serif;text-transform:uppercase;font-size:18px}
  #fb{position:absolute;left:50%;top:50%;width:22%;height:66%;margin-left:-11%;margin-top:-33%;transition:transform 3.2s cubic-bezier(.12,.8,.12,1);transform-origin:50% 50%}
  .wl{display:flex;flex-direction:column;gap:10px;width:min(760px,92vw)}
  .wrow{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:16px;padding:10px 14px;text-align:left}
  .wrow b{font-family:'Anton',sans-serif;font-weight:400;font-size:22px;text-transform:uppercase;flex:1}
  .sc{display:flex;align-items:center;gap:8px}.sc span{font-family:'Anton',sans-serif;font-size:30px;min-width:28px;text-align:center}.sc .tbtn{padding:8px 14px}
  .pong{display:flex;align-items:center;gap:24px;flex-wrap:wrap;justify-content:center}
  .pside{display:flex;flex-direction:column;align-items:center;gap:12px;border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));border-radius:22px;padding:18px 22px}
  .pt{font-family:'Anton',sans-serif;font-weight:400;font-size:26px;text-transform:uppercase}
  .pvs{font-family:'Anton',sans-serif;font-size:34px;color:var(--muted);margin:0 10px}
  .prow{display:flex;justify-content:center;gap:8px;margin-top:-4px}
  .cup{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#ff6b6b,#c81e1e);border:3px solid #fff3;transition:transform .15s,opacity .2s}
  .cup:active{transform:scale(.85)}.cup.gone{opacity:.12;background:var(--line2);border-color:transparent}
  .sbd{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}

 pong:{i(){const U=TM.on&&units().length>=2?units().slice(0,2):[{n:'Team A',c:COLORS[0]},{n:'Team B',c:COLORS[1]}];let cups=[[...Array(10)].map(()=>1),[...Array(10)].map(()=>1)],hist=[];

/* ===== teller ===== */
const DRINKS=[{k:'Pint',s:'25cl · 5,2%',g:10.3},{k:'Speciaal',s:'33cl · 8%',g:20.8},{k:'Wijn',s:'15cl · 12%',g:14.2},{k:'Shot',s:'3cl · 40%',g:9.5},{k:'Long',s:'4cl sterk',g:12.6}];
const BETA=0.15;
let CNT={};try{CNT=JSON.parse(localStorage.getItem('kp_count')||'{}')}catch(e){}
const saveC=()=>{try{localStorage.setItem('kp_count',JSON.stringify(CNT))}catch(e){}};
const BODY={m:{w:80,r:.68},v:{w:61,r:.55}};/* gemiddelde ±20-jarige; onbekend = vrouw-waarden (voorzichtigst) */
const prof=id=>{const p=CNT[id]||(CNT[id]={d:[]});if(p.d.length&&Date.now()-p.d[p.d.length-1].t>24*3.6e6)p.d=[];return p};
const bacOf=(p,a)=>{if(!p.d.length)return 0;const B=BODY[a&&a.g]||BODY.v,g=p.d.reduce((s,x)=>s+x.g,0),h=(Date.now()-p.d[0].t)/3.6e6;return Math.max(0,g/(B.w*B.r)-BETA*h)};
const durTxt=h=>{const m=Math.ceil(h*60);return m<60?m+' min':Math.floor(m/60)+'u'+String(m%60).padStart(2,'0')};
const hhmm=ms=>{const d=new Date(ms);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const level=(b,L=.5)=>L===.2&&b>=.2&&b<.5?[2,'Boven 0,2‰: met een rijbewijs van minder dan 3 jaar mag je niet rijden.']:b<.2?[0,'Bijna nuchter, maar na drinken rijden blijft een slecht idee.']:b<.5?[1,'Onder de wettelijke 0,5‰, maar je reacties zijn al trager. Twijfel je? Laat de auto staan.']
  :b<1?[2,'Boven 0,5‰: autorijden is verboden. Boete en mogelijk rijverbod.']:b<1.5?[2,'Coördinatie en inschatting gaan achteruit. Tijd voor een glas water.']
  :[3,'Stop met drinken. Water, iets eten, en laat iemand een oogje in het zeil houden.'];
const LC0=['#b9f27a','#ffd166','#ff8a65','#ff5c6c'],LC1=['#3d8a00','#a86f00','#c2410c','#be123c'];const LCc=()=>document.body.classList.contains('light')?LC1:LC0;
const NOV_START=new Date('2027-01-01').getTime();const limOf=a=>a&&a.nov&&Date.now()>=NOV_START?.2:.5;
const card=a=>{const p=prof(a.id),b=bacOf(p,a),L=limOf(a),[lv,msg]=level(b,L),zero=Date.now()+b/BETA*3.6e6,legal=Date.now()+Math.max(0,b-L)/BETA*3.6e6,cnt=p.d.length,
  std=(p.d.reduce((s,x)=>s+x.g,0)/10).toFixed(1).replace('.',',');
  return `<div class="pc" style="border-color:color-mix(in srgb,${a.c} 30%,var(--line))"><div class="h"><div style="display:flex;gap:14px;align-items:center">${av(a,48)}<div><div class="nmx">${esc(a.n)}</div><div class="small" style="margin-top:6px">${a.g==='m'?'Man':a.g==='v'?'Vrouw':'Geslacht niet ingesteld'}${a.nov?' · Beginner':''} · ${cnt} ${cnt===1?'drankje':'drankjes'} · ${std} standaardglazen</div></div></div>
    <div><div class="bac" style="color:${LCc()[lv]}">${b.toFixed(2).replace('.',',')}</div><div class="small" style="text-align:right">‰ geschat</div></div></div>
    <div class="dr">${DRINKS.map((d,i)=>`<button data-n="${a.id}" data-d="${i}"><b>+</b>${d.k}<span class="small">${d.s}</span></button>`).join('')}</div>
    <div class="warn lvl${lv}">${msg}${b>=L?`<br><b>Je blaast positief tot ±${hhmm(legal)}</b>${(b-L)/BETA>=8?' (morgen)':''}, nog ±${durTxt((b-L)/BETA)}.`:b>0?`<br><b>Onder de ${L===.2?'0,2':'0,5'}‰: je blaast niet positief.</b>`:''}${a.nov&&L===.5&&b>=.2?`<br><span style="opacity:.85">Rijbewijs &lt; 3 jaar: vanaf 2027 geldt voor jou 0,2‰. Dan zou je positief blazen tot ±${hhmm(Date.now()+(b-.2)/BETA*3.6e6)}.</span>`:''}${b>0?`<br><span style="opacity:.75">Alcohol volledig weg: ±${hhmm(zero)}.</span>`:''}</div>
    ${needWater(a.id,b)?`<div class="water"><span>💧 Tijd voor een glas water${b>=1?'. Je zit hoog':''}.</span><button class="tbtn" data-wt="${a.id}">Gedronken</button></div>`:''}
    <div class="row" style="justify-content:flex-end"><button class="tbtn" data-n="${a.id}" data-un="1">Laatste ongedaan maken</button></div></div>`};
const needWater=(id,b)=>{const p=prof(id),last=p.w||0,recent=p.d.filter(x=>Date.now()-x.t<60*6e4).length;return Date.now()-last>40*6e4&&(recent>=3||b>=.8||(p.d.length>=4&&p.d.length%3===1))};
function renderCount(){const el=$('#t-count'),P=active();
  el.innerHTML=`<div class="sec mono"><span>Teller</span><span>${P.length} ${P.length===1?'speler':'spelers'} vanavond</span></div>
   <div class="row" style="justify-content:flex-end;margin-bottom:18px"><button class="tbtn" id="cp">Spelers beheren</button><button class="tbtn" id="co">Overzicht einde avond</button><button class="tbtn" id="cr">Teller resetten</button></div>
   ${P.length?`<div class="pcs">${P.map(card).join('')}</div>`:'<div class="hint" style="text-align:left">Nog niemand geselecteerd. Duid in Spelers aan wie er vanavond meedoet.</div>'}
   <p class="small" style="margin-top:22px;line-height:1.5">Ruwe schatting met het gemiddelde gewicht van een twintigjarige: 80 kg voor mannen, 61 kg voor vrouwen. Weeg je minder, dan ligt je promillage hoger. Je echte waarde kan nog hoger liggen door weinig eten, medicatie, vermoeidheid of snel drinken. Twijfel je? Niet rijden. Ook niet met de fiets of de step.</p>`;
  $('#cp').onclick=()=>showTab('players');
  $('#cr').onclick=()=>{if($('#cr').dataset.sure){CNT={};saveC();renderCount()}else{$('#cr').dataset.sure=1;$('#cr').textContent='Zeker? Tik nog eens'}};
  $('#co').onclick=overview;
  el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{prof(b.dataset.n).d.push({t:Date.now(),g:DRINKS[+b.dataset.d].g});saveC();beep(700,.04,.08,'triangle');renderCount()});
  el.querySelectorAll('[data-un]').forEach(b=>b.onclick=()=>{prof(b.dataset.n).d.pop();saveC();renderCount()});
  el.querySelectorAll('[data-wt]').forEach(b=>b.onclick=()=>{prof(b.dataset.wt).w=Date.now();saveC();bump('water',b.dataset.wt);beep(1200,.05,.08,'sine');renderCount()});}
function overview(){/* iedereen die vanavond iets dronk, ook wie al vertrokken is */
  const rows=ACC.filter(a=>ACT.ids.includes(a.id)||(CNT[a.id]&&prof(a.id).d.length)).map(a=>{const p=prof(a.id),b=bacOf(p,a);const L=limOf(a);return{a,b,L,c:p.d.length,z:Date.now()+b/BETA*3.6e6,l:Date.now()+Math.max(0,b-L)/BETA*3.6e6}}).sort((x,y)=>y.b-x.b);
  clr();$('#gt').textContent='Einde avond';$('#gc').textContent='';$('#ov').classList.add('open');
  scr(`<div class="pr" style="font-size:clamp(34px,5vw,60px)">Wie blaast er<br>nog positief?</div>
   <table class="lb" style="max-width:860px">${rows.map(r=>{const[lv]=level(r.b,r.L);return `<tr><td>${av(r.a,40)}</td><td class="n">${esc(r.a.n)}${ACT.ids.includes(r.a.id)?'':' <span class="small">(vertrokken)</span>'}</td><td>${r.c} ${r.c===1?'drankje':'drankjes'}</td>
     <td style="font-family:'Anton',sans-serif;font-size:28px;color:${LCc()[lv]}">${r.b.toFixed(2).replace('.',',')}‰</td>
     <td>${r.b>=r.L?'Positief tot <b>'+hhmm(r.l)+'</b>'+((r.b-r.L)/BETA>=8?' morgen':''):'<span style="color:#b9f27a">Blaast niet positief</span>'}</td></tr>`}).join('')||'<tr><td>Nog niets geteld.</td></tr>'}</table>
   ${COMP.on&&standings().some(x=>x.p)?'<div class="mono" style="margin-top:6px">Zwijn van de Avond</div>'+podiumHTML():''}${statsHTML()}<div class="hint">Iedereen boven de limiet gaat te voet, met een taxi, het openbaar vervoer of een BOB naar huis. Voel je je slecht of krijg je iemand niet wakker? Bel 112.</div>
   <button class="btn" id="ok">Terug naar teller</button>`);
  $('#ok').onclick=()=>{$('#ov').classList.remove('open');renderCount()}}

  return `<div class="sec mono" style="margin-top:30px"><span>Teams</span><span>${TM.on?U.length+' teams':'uit'}</span></div>
  <div class="row" style="justify-content:flex-start;align-items:center">

  g.gain.setValueAtTime(0,a.currentTime+t0);g.gain.linearRampToValueAtTime(v,a.currentTime+t0+.02);g.gain.setValueAtTime(v,a.currentTime+t0+d*.8);g.gain.linearRampToValueAtTime(0,a.currentTime+t0+d);o.connect(g);g.connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+d+.05)};
const noise=(t0,d,v=.4,fq=1200,decay=2)=>{const a=AC(),len=a.sampleRate*d,b=a.createBuffer(1,len,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<len;i++)x[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);
  const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();f.type='bandpass';f.frequency.value=fq;g.gain.value=v;s.buffer=b;s.connect(f);f.connect(g);g.connect(a.destination);s.start(a.currentTime+t0)};

  <div class="small" style="margin-top:6px">Verdien punten in de spellen. Op het einde: een podium en de Zwijn van de Avond.${COMP.on&&standings()[0]&&standings()[0].p?' Nu leidt <b style="color:var(--fg)">'+esc(standings()[0].a.n)+'</b> met '+standings()[0].p+' pt.':''}</div></div>
  <div class="seg"><span class="sg ${!COMP.on?'on':''}" data-cp="off">Uit</span><span class="sg ${COMP.on?'on':''}" data-cp="on">Aan</span></div>
  ${COMP.on?'<button class="tbtn" id="cpst">🏆 Stand</button>':''}</div>`;
const bindComp=()=>{document.querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>{COMP.on=b.dataset.cp==='on';if(COMP.on&&!COMP.log.length)COMP.t=Date.now();saveComp();renderGames()});const s=$('#cpst');if(s)s.onclick=openPodium};

 'Voetballers':['Lionel Messi','Cristiano Ronaldo','Kylian Mbappé','Erling Haaland','Jude Bellingham','Vinícius Júnior','Harry Kane','Mohamed Salah','Lamine Yamal','Luka Modrić','Neymar','Zlatan Ibrahimović','Robert Lewandowski','Karim Benzema','Pedri','Bukayo Saka','Jamal Musiala','Virgil van Dijk','Florian Wirtz','Zinedine Zidane','Ronaldinho','David Beckham'],

 'Artiesten':['Taylor Swift','Beyoncé','Drake','Rihanna','Ed Sheeran','Billie Eilish','Bad Bunny','Dua Lipa','The Weeknd','Lady Gaga','Eminem','Adele','Bruno Mars','Shakira','Harry Styles','Travis Scott','Sabrina Carpenter','Kendrick Lamar','Michael Jackson','Madonna','Freddie Mercury','Elvis Presley']};
Object.assign(G,{
 wbi:{i(){let cat=null;
   const pick=()=>{clr();T.next();const cats=Object.keys(WBI).concat(active().length>=3?['Iemand hier aan tafel']:[]);
     scr(`${T.tag('Raadt')}<div class="pr" style="font-size:clamp(34px,5vw,60px)">Kies een categorie</div><div class="qgrid">${cats.map(k=>`<button class="qo" data-k="${k}">${k}</button>`).join('')}<button class="qo" data-k="Mix">🎲 Mix van alles</button></div>`);
     st.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{cat=b.dataset.k;ready()})};
   const getName=()=>{if(cat==='Iemand hier aan tafel'){const me=T.p?(T.p.ids||[T.p.id]):[];const o=active().filter(a=>!me.includes(a.id));return o.length?o[Math.random()*o.length|0].n:'Jezelf'}
     const all=cat==='Mix'?Object.values(WBI).flat():WBI[cat];return nightDeck('wbi_'+(cat==='Mix'?'mix':cat),all)()};
   const ready=()=>{scr(`<div class="pr" style="font-size:clamp(34px,5vw,60px)">iPad op je voorhoofd</div><div class="hint">Scherm naar de groep. Stel ja/nee-vragen (‘Ben ik een man?’, ‘Speel ik voetbal?’). De groep antwoordt enkel ja of nee. Je hebt 2 minuten.</div><button class="btn" id="go">Start</button>`);$('#go').onclick=run};
   const run=()=>{const name=getName(),t0=Date.now();let left=120;st.style.position='relative';
     scr(`<div class="kop"><button class="kz pas" id="wq">Opgeven</button><div class="kw"><div class="mono">${esc(cat)}</div><div class="pr" style="font-size:clamp(46px,8vw,110px)">${esc(name)}</div><div class="timer" id="wt" style="font-size:64px">2:00</div></div><button class="kz ok" id="wg">Geraden!</button></div>`);
     const end=g=>{clr();st.style.position='';const sec=Math.round((Date.now()-t0)/1000);let pts=0,msg;
       if(g){pts=sec<45?3:sec<90?2:1;msg=`Geraden in ${sec} seconden! Deel ${pts} ${pts>1?'slokken':'slok'} uit.`;SB[3].f();joeg('JOEGNEE!',name)}else{msg=`Het was <b style="color:var(--fg)">${esc(name)}</b>. Drink 2 slokken.`;SB[5].f()}
       award(T.p,pts,'Wie Ben Ik');scr(`<div class="pr">${g?'🎯 Juist':'💀 Mis'}</div><div class="hint">${msg}</div><button class="btn" id="nx">Volgende speler</button>`);$('#nx').onclick=pick};
     $('#wg').onclick=()=>end(true);$('#wq').onclick=()=>end(false);
     timers.push(setInterval(()=>{left--;const t=$('#wt');if(!t)return clr();t.textContent=Math.floor(Math.max(0,left)/60)+':'+String(Math.max(0,left)%60).padStart(2,'0');if(left<=10&&left>0)beep(700,.05,.1);if(left<=0)end(false)},1000))};
   pick()}}
});

renderGames();
try{if(localStorage.getItem('kp_pl_back')==='1'){localStorage.removeItem('kp_pl_back');const s=JSON.parse(localStorage.getItem('kp_pl')||'null');if(s&&Date.now()-s.t<8*3.6e6){PL={list:s.list,i:s.i};showTab('games');$('#ov').classList.add('open');plBar();plNext()}}}catch(e){}
/* ===== automatisch updaten ===== */
const APPVER='1794949894';
const checkUpd=async()=>{try{const r=await fetch('version.txt?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const v=(await r.text()).trim();
  if(v&&+v>+APPVER&&!$('#ov').classList.contains('open')){location.replace(location.pathname+'?v='+v)}}catch(e){}};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpd()});setInterval(checkUpd,3*60000);setTimeout(checkUpd,3000);
</script>
