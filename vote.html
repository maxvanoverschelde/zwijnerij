<!DOCTYPE html>
<html lang="nl">
<head>

<style>
:root{--bg:#070707;--fg:#ededed;--muted:#7a7a7a;--line:#222;--card:#101010;--acc:#d4ff3a;--wolf:#ff4d6d;--moon:#7aa2ff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);color:var(--fg);font-family:'Inter Tight',system-ui,sans-serif}
body{padding:calc(env(safe-area-inset-top,0px) + 20px) max(20px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom,0px) + 24px) max(20px,env(safe-area-inset-left));min-height:100vh;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none}
body.night{background:radial-gradient(circle at 50% -10%,#16203d 0%,#070707 60%)}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.mono{font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.brand{font-family:'Anton',sans-serif;font-size:26px;text-transform:uppercase;letter-spacing:.01em}
.brand i{font-style:normal;color:var(--wolf)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;width:100%;max-width:1100px;margin:0 auto}
.h1{font-family:'Anton',sans-serif;font-size:clamp(40px,8vw,96px);line-height:.95;text-transform:uppercase}
.h2{font-family:'Anton',sans-serif;font-size:clamp(28px,5vw,54px);line-height:1;text-transform:uppercase}
.hint{color:var(--muted);font-size:17px;line-height:1.45;max-width:640px}
.btn{background:var(--acc);color:#000;font-family:'JetBrains Mono',monospace;font-weight:600;text-transform:uppercase;letter-spacing:.12em;font-size:15px;padding:20px 38px;border-radius:999px;transition:transform .1s}
.btn:active{transform:scale(.96)}.btn.ghost{background:none;color:var(--fg);border:1px solid #333}.btn.red{background:var(--wolf);color:#000}
.btn:disabled{opacity:.35}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
input.f{background:#111;border:1px solid #2c2c2c;border-radius:16px;padding:18px 20px;font-size:22px;width:min(420px,88vw);outline:none;text-align:center}
input.code{font-family:'Anton',sans-serif;font-size:44px;letter-spacing:.3em;text-transform:uppercase}
.code-big{font-family:'Anton',sans-serif;font-size:clamp(70px,14vw,150px);letter-spacing:.18em;color:var(--acc);line-height:1}
.lobby{display:grid;grid-template-columns:auto 1fr;gap:34px;align-items:center;width:100%}
#qr{background:#fff;padding:14px;border-radius:20px;display:inline-block}
#qr img,#qr canvas{display:block;width:220px!important;height:220px!important}
.plist{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pchip{border:1px solid #2c2c2c;border-radius:999px;padding:10px 16px;font-size:18px;display:flex;align-items:center;gap:8px}
.pchip.dead{opacity:.35;text-decoration:line-through}
.pchip .dot{width:9px;height:9px;border-radius:50%;background:#3cff8a}.pchip .dot.off{background:#555}
.pchip .x{color:var(--muted);margin-left:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;width:100%;max-width:720px}
.choice{border:1px solid #2c2c2c;border-radius:18px;padding:20px 12px;font-family:'Anton',sans-serif;font-size:24px;text-transform:uppercase;background:var(--card)}
.choice.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 15%,var(--card));color:var(--acc)}
.choice.wolfsel{border-color:var(--wolf);color:var(--wolf)}
.role{border-radius:28px;padding:30px 24px;width:min(560px,100%);border:2px solid var(--c);background:color-mix(in srgb,var(--c) 10%,#0a0a0a);display:flex;flex-direction:column;gap:12px;align-items:center}
.role .emo{font-size:72px;line-height:1}
.role .rn{font-family:'Anton',sans-serif;font-size:46px;text-transform:uppercase;color:var(--c);line-height:1}
.task{border:2px dashed var(--wolf);border-radius:20px;padding:18px;max-width:560px}
.task b{display:block;font-family:'Anton',sans-serif;font-weight:400;font-size:28px;text-transform:uppercase;color:var(--wolf);margin-top:6px;line-height:1.1}
.timer{font-family:'Anton',sans-serif;font-size:clamp(70px,14vw,140px);font-variant-numeric:tabular-nums;line-height:1}
.hide{filter:blur(18px)}
.peek{border:1px solid #333;border-radius:999px;padding:12px 20px;font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.bar{height:8px;background:#1a1a1a;border-radius:9px;overflow:hidden;width:min(520px,90vw)}.bar i{display:block;height:100%;background:var(--acc)}
.small{font-size:14px;color:var(--muted)}
.tbtn{border:1px solid #2c2c2c;border-radius:999px;padding:11px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.seg{display:flex;border:1px solid #2c2c2c;border-radius:999px;overflow:hidden}.seg button{padding:10px 14px;font-size:14px;color:var(--muted)}.seg button.on{background:#ededed;color:#000}
.log{font-size:15px;color:var(--muted);max-width:640px;line-height:1.6}
.err{color:var(--wolf)}
.rlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;width:100%;max-width:900px;text-align:left}
.rc{border:1px solid color-mix(in srgb,var(--c) 50%,#222);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;background:color-mix(in srgb,var(--c) 6%,#0a0a0a)}
.rc b{font-family:'Anton',sans-serif;font-weight:400;font-size:22px;text-transform:uppercase;color:var(--c)}.rc span{font-size:14px;color:#bdbdbd;line-height:1.4}
.script{border:1px solid #333;border-radius:20px;padding:16px 20px;max-width:560px;text-align:left;display:flex;flex-direction:column;gap:10px;font-size:18px;line-height:1.45;background:#0d0d0d}
.wrow2{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #222;padding:10px 4px;text-align:left}.wrow2.dead{opacity:.4;text-decoration:line-through}
details summary::-webkit-details-marker{display:none}
@media(max-width:760px){.lobby{grid-template-columns:1fr;justify-items:center}}
.leftbox{width:min(560px,100%);display:flex;flex-direction:column;gap:8px;align-items:center;margin-top:6px}
.leftbox>div{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.lchip{border:1px solid var(--c);color:var(--c);border-radius:999px;padding:6px 12px;font-weight:700;font-size:15px}
.youare{font-size:20px;margin-top:8px;cursor:pointer}.youare b{display:inline-block}
.opts{width:min(560px,100%)}.optgrid{display:grid;grid-template-columns:auto 1fr;gap:12px 14px;align-items:center;margin-top:14px;text-align:left}
.rtg{cursor:pointer;opacity:.45}.rtg.ron{opacity:1;border-color:var(--acc);color:var(--acc)}
@keyframes fl{0%{box-shadow:inset 0 0 0 9999px rgba(212,255,58,.35)}100%{box-shadow:inset 0 0 0 9999px transparent}}body.flash{animation:fl 1.2s ease-out 2}
a,a:visited{color:inherit}
#home{color:var(--fg,#ededed)}
.qq{font-family:'Anton',sans-serif;font-size:clamp(34px,5.5vw,72px);line-height:1.05;text-transform:uppercase;max-width:1000px}
.bars{display:flex;flex-direction:column;gap:10px;width:min(640px,100%)}.barrow{display:grid;grid-template-columns:120px 1fr 40px;gap:12px;align-items:center;text-align:left}.barrow .bar{width:100%;height:22px}.barrow b{font-family:'Anton',sans-serif;font-size:24px;color:var(--acc)}
a,a:visited{color:inherit}#home{color:var(--fg)}
</style>
</head>
<body>
<div class="top"><a href="./" class="tbtn" style="text-decoration:none" id="home">← Zwijnerij</a><div class="brand">Wie van <i>ons</i></div><div class="mono" id="me"></div></div>
<main id="app"><div class="hint">Laden…</div></main>
<script>
const WIE0=["heeft de meeste ex'en", "stuurt het eerst een dronken bericht vanavond", "is stiekem het best in bed, denk je", "kust vanavond nog iemand", "wordt het eerst ontrouw", "heeft de raarste zoekgeschiedenis", "eindigt vanavond in de verkeerde kot", "heeft ooit iemand van deze groep gekust", "liegt het vaakst over waar hij was", "gaat als eerste trouwen voor het geld", "zou meedoen aan Temptation Island", "heeft de gênantste crush", "stuurt nog berichten naar zijn ex", "valt vanavond als eerste in slaap op de zetel", "zou een OnlyFans beginnen als het slecht ging", "heeft de slechtste smaak in partners", "eindigt het vaakst met een kater op maandag", "is het meest jaloers in een relatie", "zou een geheim het snelst verklappen", "flirt met iedereen, ook als hij bezet is", "heeft het meeste geld uitgegeven op één avond", "maakt het eerst ruzie met de uitsmijter", "wordt vanavond het dronkenst", "doet morgen alsof hij zich niks herinnert", "wordt het eerst gearresteerd op reis", "zou daten met een prof", "heeft het langste lijstje datingmatches", "schaamt zich het meest voor zijn eerste kus", "zou nooit toegeven dat hij verliefd is", "is het slechtst in geheimen bewaren"];const WIE1=["wordt het eerst rijk","belt vanavond nog zijn mama","gaat het eerst naar huis","is de beste kok","heeft de luidste lach","zou het langst overleven in de jungle","zou het eerst gearresteerd worden","is het meest verslaafd aan zijn gsm","komt altijd te laat","vergeet het vaakst zijn sleutels","zou de beste politicus zijn","danst het slechtst","zingt het valst onder de douche","heeft de meeste schoenen","zou meedoen aan Big Brother","is het slechtst in geheimen bewaren","eet het meest frieten","zou een tattoo van zijn ex nemen","verdwaalt het vaakst","is het meest competitief","zou het eerst een kot in brand steken","heeft de vreemdste hobby","is de beste chauffeur","stuurt de meeste spraakberichten","zou het eerst zijn studies stoppen","heeft de beste muzieksmaak","is het meest dramatisch","zou het eerst viraal gaan","kan het best liegen","heeft de grootste kater morgen"];
const SB_URL='https://koenqjuwnngluqxseodq.supabase.co',SB_KEY='sb_publishable_FV0_pSspnXUlZXFES5Ga4w_gzlX2kFm';
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const ls={get:(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const rid=()=>Math.random().toString(36).slice(2,10);
let actx;const beep=(f=660,d=.1,v=.2,t='sine')=>{try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}};
const buzzSnd=()=>{beep(180,.35,.35,'square');setTimeout(()=>beep(140,.35,.3,'square'),120)};
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
let wl=null;const wake=async()=>{try{if('wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>wl=null)}}catch(e){}};document.addEventListener('click',wake);
const sb=window.supabase?window.supabase.createClient(SB_URL,SB_KEY,{realtime:{params:{eventsPerSecond:20}}}):null;
let ch=null;
const join=(code,pid,meta,onMsg)=>new Promise(res=>{ch=sb.channel('wv-'+code,{config:{broadcast:{self:false},presence:{key:pid}}});
  ch.on('broadcast',{event:'m'},({payload})=>onMsg(payload));ch.subscribe(async s=>{if(s==='SUBSCRIBED'){await ch.track(meta);res()}})});
const send=p=>ch&&ch.send({type:'broadcast',event:'m',payload:p});

const QV=shuf(WIE0.concat(WIE1));
/* ===== iPad: scherm ===== */
const H={code:null,players:{},order:[],phase:'lobby',qi:-1,q:null,votes:{},res:null,n:0,tally:{}};
const saveH=()=>ls.set('wv_host',{...H,t:Date.now()});
const nm=p=>H.players[p]?.n||'?';
const pub=()=>({t:'state',phase:H.phase,code:H.code,players:H.order.map(p=>({id:p,n:nm(p)})),q:H.q,voted:Object.keys(H.votes),n:H.n});
const broadcast=()=>{send(pub());saveH();renderHost()};
const next=()=>{H.qi=(H.qi+1)%QV.length;H.q=QV[H.qi];H.votes={};H.res=null;H.n++;H.phase='vote';beep(520,.12);broadcast()};
const close=()=>{if(H.phase!=='vote')return;const c={};Object.values(H.votes).forEach(v=>c[v]=(c[v]||0)+1);H.res=Object.entries(c).sort((a,b)=>b[1]-a[1]);
  const top=H.res.length?H.res[0][1]:0;H.res.filter(x=>x[1]===top).forEach(([id])=>H.tally[id]=(H.tally[id]||0)+1);H.phase='res';beep(880,.2);broadcast()};
const onHostMsg=m=>{
  if(m.t==='join'){if(!H.players[m.pid]){let nn=m.n.slice(0,16),k=2;while(Object.values(H.players).some(p=>p.n.toLowerCase()===nn.toLowerCase()))nn=m.n.slice(0,14)+' '+(k++);H.players[m.pid]={n:nn};H.order.push(m.pid);beep(880)}broadcast();return}
  if(m.t==='vote'&&H.phase==='vote'&&H.players[m.pid]&&H.players[m.target]){H.votes[m.pid]=m.target;beep(700,.05);broadcast();if(Object.keys(H.votes).length>=H.order.length)setTimeout(close,700);return}
  if(m.t==='hello')send(pub())};
const renderHost=()=>{
  if(H.phase==='lobby'){const n=H.order.length,url=location.origin+location.pathname+'?c='+H.code;
    app.innerHTML=`<div class="lobby"><div><div id="qr"></div></div><div style="text-align:left;display:flex;flex-direction:column;gap:16px"><div class="mono">Scan de QR-code of vul de code in</div><div class="code-big">${H.code}</div>
      <div class="plist" style="justify-content:flex-start">${H.order.map(p=>`<span class="pchip">${esc(nm(p))}<span class="x" data-kick="${p}">✕</span></span>`).join('')||'<span class="small">Nog niemand…</span>'}</div>
      <div class="hint" style="text-align:left">Iedereen stemt geheim op zijn gsm. Op de iPad zie je alleen hoeveel stemmen iemand kreeg, niet van wie.</div>
      <button class="btn" id="go" ${n<3?'disabled':''}>Start (${n} spelers${n<3?', min. 3':''})</button></div></div>`;
    try{new QRCode($('#qr'),{text:url,width:220,height:220,correctLevel:QRCode.CorrectLevel.M})}catch(e){}
    app.querySelectorAll('[data-kick]').forEach(b=>b.onclick=()=>{const id=b.dataset.kick;delete H.players[id];H.order=H.order.filter(x=>x!==id);send({t:'reject',to:id});broadcast()});
    $('#go').onclick=()=>{H.tally={};H.n=0;next()};return}
  if(H.phase==='vote'){const nv=Object.keys(H.votes).length;
    app.innerHTML=`<div class="mono">Vraag ${H.n} · stem op je gsm</div><div class="qq">Wie van ons ${esc(H.q)}?</div><div class="h2">${nv} / ${H.order.length} gestemd</div>
      <div class="plist">${H.order.map(p=>`<span class="pchip ${H.votes[p]?'':'dead'}">${H.votes[p]?'✓ ':''}${esc(nm(p))}</span>`).join('')}</div><button class="tbtn" id="cl">Stemming sluiten</button>`;$('#cl').onclick=close;return}
  if(H.phase==='res'){const max=H.res.length?H.res[0][1]:1,top=H.res.filter(x=>x[1]===max).map(x=>nm(x[0]));
    app.innerHTML=`<div class="mono">Wie van ons ${esc(H.q)}?</div><div class="h1">${top.length?top.map(esc).join(' & '):'Niemand'}</div><div class="hint">${top.length?(top.length>1?'drinken':'drinkt')+' '+(max>=Math.ceil(H.order.length/2)?'3 slokken: meer dan de helft is akkoord!':'2 slokken.'):''}</div>
      <div class="bars">${H.res.map(([id,v])=>`<div class="barrow"><span>${esc(nm(id))}</span><div class="bar"><i style="width:${v/max*100}%"></i></div><b>${v}</b></div>`).join('')}</div>
      <div class="row"><button class="btn" id="nx">Volgende vraag</button><button class="tbtn" id="st">Stand</button><button class="tbtn" id="lb">Stoppen</button></div>`;
    $('#nx').onclick=next;$('#lb').onclick=()=>{H.phase='lobby';broadcast()};
    $('#st').onclick=()=>{const r=Object.entries(H.tally).sort((a,b)=>b[1]-a[1]);app.innerHTML=`<div class="h1">Meest gekozen</div><div class="bars">${r.map(([id,v])=>`<div class="barrow"><span>${esc(nm(id))}</span><div class="bar"><i style="width:${v/(r[0][1]||1)*100}%"></i></div><b>${v}×</b></div>`).join('')}</div><button class="btn" id="bk">Terug</button>`;$('#bk').onclick=renderHost};return}};
const makeCode=()=>Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0]).join('');
const startHost=async resume=>{wake();const s=ls.get('wv_host',null);if(resume&&s&&Date.now()-s.t<6*3.6e6)Object.assign(H,s);else H.code=makeCode();
  app.innerHTML=`<div class="h2">Lobby maken…</div>`;await join(H.code,'host',{host:1},onHostMsg);broadcast()};
/* ===== gsm ===== */
const Pl={pid:null,n:'',code:null,state:null,sel:null};
const startPlayer=async code=>{Pl.code=code.toUpperCase();const st=ls.get('wv_p_'+Pl.code,null);Pl.pid=st?.pid||rid();Pl.n=st?.n||ls.get('ww_name','');
  if(!Pl.n){app.innerHTML=`<div class="mono">Lobby ${esc(Pl.code)}</div><div class="h1">Hoe heet je?</div><input class="f" id="nm" maxlength="16" placeholder="Je naam" autocomplete="off"><button class="btn" id="ok">Doe mee</button>`;
    const go=()=>{const v=$('#nm').value.trim();if(!v)return;ls.set('ww_name',v);startPlayer(Pl.code)};$('#ok').onclick=go;$('#nm').onkeydown=e=>{if(e.key==='Enter')go()};return}
  ls.set('wv_p_'+Pl.code,{pid:Pl.pid,n:Pl.n});$('#me').textContent=Pl.n;app.innerHTML=`<div class="h2">Verbinden…</div>`;
  await join(Pl.code,Pl.pid,{n:Pl.n},onPlayerMsg);send({t:'join',pid:Pl.pid,n:Pl.n});
  setTimeout(()=>{if(!Pl.state)app.innerHTML=`<div class="h2">Lobby ${esc(Pl.code)} niet gevonden</div><div class="hint">Klopt de code? Staat het spel nog open op de iPad?</div><button class="btn" onclick="location.href=location.pathname">Andere code</button>`},6000)};
const onPlayerMsg=m=>{
  if(m.t==='state'){const first=!Pl.state,prev=Pl.state;Pl.state=m;if(first)send({t:'join',pid:Pl.pid,n:Pl.n});if(!prev||prev.n!==m.n){Pl.sel=null;if(m.phase==='vote')vib(80)}renderPlayer();return}
  if(m.t==='reject'&&m.to===Pl.pid)app.innerHTML=`<div class="h2">Je werd uit de lobby verwijderd.</div>`};
const renderPlayer=()=>{const s=Pl.state;if(!s)return;
  if(s.phase==='lobby'){app.innerHTML=`<div class="mono">Lobby ${esc(s.code)}</div><div class="h1">Je zit erin</div><div class="hint">Wacht tot het spel start op de iPad.</div>`;return}
  if(s.phase==='res'){app.innerHTML=`<div class="h2">Kijk naar de iPad 👀</div>`;return}
  if(s.voted.includes(Pl.pid)){app.innerHTML=`<div style="font-size:70px">🤫</div><div class="h2">Gestemd</div><div class="hint">Niemand ziet op wie. ${s.voted.length}/${s.players.length} gestemd.</div>`;return}
  app.innerHTML=`<div class="mono">Geheime stem</div><div class="h2">Wie van ons ${esc(s.q)}?</div><div class="grid">${s.players.map(p=>`<button class="choice ${Pl.sel===p.id?'sel':''}" data-c="${p.id}">${esc(p.n)}${p.id===Pl.pid?' (jij)':''}</button>`).join('')}</div><button class="btn" id="cf" ${Pl.sel?'':'disabled'}>Stem</button>`;
  app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{Pl.sel=b.dataset.c;renderPlayer()});$('#cf').onclick=()=>{if(Pl.sel)send({t:'vote',pid:Pl.pid,target:Pl.sel})}};
/* ===== start ===== */
(async()=>{if(!sb){app.innerHTML='<div class="h2 err">Geen internet: dit spel heeft een verbinding nodig.</div>';return}
  const q=new URLSearchParams(location.search);

  if(q.get('c'))return startPlayer(q.get('c'));
